<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的生活工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bd6'/%3E%3Cpath d='M9 17l4 4 10-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">我</div>
      <div class="brand-text">
        <b>生活工作台</b>
        <span>本地运行 · 数据不上云</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span>版本 <b>v1.0</b> · 数据存在本机浏览器</span>
      <span id="footSaved">—</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">首页总览</h1>
        <p class="sub" id="pageSub"></p>
      </div>
      <div class="topbar-actions">
        <span class="save-state" id="saveState"><i class="dot"></i><span>已就绪</span></span>
        <button class="btn btn-soft btn-sm" id="btnTheme" title="切换深色 / 浅色">深色</button>
        <button class="btn btn-primary" id="btnSave" title="保存到本机（Ctrl+S）">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          保存
        </button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/sample.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/media.js"></script>
<script src="js/views/dev.js"></script>
<script src="js/views/consult.js"></script>
<script src="js/views/fitness.js"></script>
<script src="js/views/diet.js"></script>
<script src="js/views/games.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>

        { key: 'estimate', label: '预估工时（小时）', type: 'number', min: 0, step: 0.5 },
        { key: 'due', label: '截止日期', type: 'date' },
        { key: 'note', label: '备注', type: 'textarea', span: 2 }
      ],
      values: item || { projectId: '', type: 'task', status: 'todo', priority: 'mid', estimate: 1, due: '', note: '' },
      onSubmit: function (v) {
        Store.update(function (s) {
          if (item) {
            var it = Core.byId(s.dev.items, item.id);
            if (it) {
              it.title = v.title; it.projectId = v.projectId; it.type = v.type; it.status = v.status;
              it.priority = v.priority; it.estimate = v.estimate; it.due = v.due; it.note = v.note;
              if (v.status === 'done' && !it.doneAt) it.doneAt = Core.nowISO();
              if (v.status !== 'done') it.doneAt = '';
            }
          } else {
            s.dev.items.push({
              id: Core.uid('task'), title: v.title, projectId: v.projectId, type: v.type, status: v.status,
              priority: v.priority, estimate: v.estimate, due: v.due, doneAt: v.status === 'done' ? Core.nowISO() : '',
              note: v.note, createdAt: Core.nowISO()
            });
          }
        }, 'dev-item');
        renderAfter();
      }
    });
  }

  function projectForm(proj, after) {
    UI.formModal({
      title: proj ? '编辑项目' : '新建项目',
      fields: [
        { key: 'name', label: '项目名称', type: 'text', required: true, span: 2, placeholder: '例如：客户官网改版' },
        { key: 'color', label: '颜色', type: 'select', options: COLORS.map(function (c) { return { v: c, t: c }; }) },
        { key: 'note', label: '备注', type: 'text' }
      ],
      values: proj || { name: '', color: COLORS[Store.get().dev.projects.length % COLORS.length], note: '' },
      onSubmit: function (v) {
        Store.update(function (s) {
          if (proj) {
            var p = Core.byId(s.dev.projects, proj.id);
            if (p) { p.name = v.name; p.color = v.color; p.note = v.note; }
          } else {
            s.dev.projects.push({ id: Core.uid('proj'), name: v.name, color: v.color, note: v.note });
          }
        }, 'dev-project');
        renderAfter();
        if (typeof after === 'function') after();
      }
    });
  }

  function renderAfter() {
    var host = document.querySelector('#view > div');
    if (host) render(host);
  }

  /* ---- 项目管理弹窗 ---- */

  function projectManager() {
    var m = UI.modal({
      title: '项目管理',
      desc: '项目用来给工作项分组，删除项目不会删除工作项',
      body: '<div id="projRows"></div>',
      foot: '<button class="btn" data-close-btn="1">关闭</button>' +
            '<button class="btn btn-primary" data-new="1">+ 新建项目</button>'
    });

    function paint() {
      var projects = Store.get().dev.projects;
      var rows = m.el.querySelector('#projRows');
      if (!projects.length) {
        rows.innerHTML = UI.emptyState('layers', '还没有项目', '新建一个项目，工作项就能按项目筛选了');
        return;
      }
      rows.innerHTML = projects.map(function (p) {
        var count = Store.get().dev.items.filter(function (i) { return i.projectId === p.id; }).length;
        return '<div class="spread" style="padding:9px 2px;border-bottom:1px solid var(--border)">' +
          '<div class="row"><span class="stripe" style="background:' + p.color + ';height:16px"></span>' +
          '<b style="font-size:13px">' + UI.esc(p.name) + '</b><span class="small muted">' + count + ' 项</span></div>' +
          '<div class="row" style="gap:2px">' +
            '<button class="icon-btn" data-pedit="' + p.id + '">' + UI.icon('edit', 14) + '</button>' +
            '<button class="icon-btn danger" data-pdel="' + p.id + '">' + UI.icon('trash', 14) + '</button>' +
          '</div></div>';
      }).join('');
    }

    paint();
    UI.bind(m.el, 'click', function (e) {
      var edit = e.target.closest('[data-pedit]');
      var del = e.target.closest('[data-pdel]');
      if (edit) projectForm(Core.byId(Store.get().dev.projects, edit.dataset.pedit), paint);
      if (del) {
        var id = del.dataset.pdel;
        UI.confirm({
          title: '删除项目', message: '项目下的工作项会变成「未归类」，不会被删除。',
          confirmText: '删除', danger: true
        }).then(function (ok) {
          if (!ok) return;
          Store.update(function (s) {
            s.dev.projects = s.dev.projects.filter(function (p) { return p.id !== id; });
            s.dev.items.forEach(function (i) { if (i.projectId === id) i.projectId = ''; });
          }, 'dev-project-del');
          paint();
          renderAfter();
        });
      }
    });
    m.el.querySelector('[data-new]').addEventListener('click', function () { projectForm(null, paint); });
    m.el.querySelector('[data-close-btn]').addEventListener('click', m.close);
  }

  /* ---- 渲染 ---- */

  function cardHTML(it, today) {
    var proj = projectOf(it.projectId);
    var t = TYPES[it.type] || TYPES.task;
    var overdue = it.status !== 'done' && it.due && it.due < today;
    var idx = STATUS.findIndex(function (s) { return s.key === it.status; });
    var inPlan = UI.inPlanToday(it.id);

    return '<div class="kcard">' +
      '<div class="row" style="align-items:flex-start;gap:7px">' +
        '<span class="stripe" style="background:' + (proj ? proj.color : 'var(--border-strong)') + '"></span>' +
        '<div class="grow"><div class="title">' + UI.esc(it.title) + '</div></div>' +
      '</div>' +
      '<div class="meta">' +
        '<span class="tag ' + t.cls + '">' + t.name + '</span>' +
        (proj ? '<span class="tag">' + UI.esc(proj.name) + '</span>' : '') +
        (it.priority === 'high' ? '<span class="tag danger">高优先</span>' : '') +
        (it.due ? '<span class="tag ' + (overdue ? 'danger' : '') + '">' + Core.fmtDateShort(it.due) + (overdue ? ' 逾期' : '') + '</span>' : '') +
        (it.estimate ? '<span class="tag">' + it.estimate + 'h</span>' : '') +
        (inPlan ? '<span class="tag info">已排入今日</span>' : '') +
      '</div>' +
      '<div class="ops">' +
        '<button class="icon-btn" data-act="move" data-id="' + it.id + '" data-dir="-1" title="左移"' + (idx === 0 ? ' disabled style="opacity:.3"' : '') + '>' + UI.icon('chevronLeft', 14) + '</button>' +
        '<button class="icon-btn" data-act="move" data-id="' + it.id + '" data-dir="1" title="右移"' + (idx === STATUS.length - 1 ? ' disabled style="opacity:.3"' : '') + '>' + UI.icon('chevronRight', 14) + '</button>' +
        '<span class="spacer"></span>' +
        '<button class="icon-btn" data-act="plan" data-id="' + it.id + '" title="加入今日计划">' + UI.icon('target', 14) + '</button>' +
        '<button class="icon-btn" data-act="edit" data-id="' + it.id + '" title="编辑">' + UI.icon('edit', 14) + '</button>' +
        '<button class="icon-btn danger" data-act="del" data-id="' + it.id + '" title="删除">' + UI.icon('trash', 14) + '</button>' +
      '</div>' +
    '</div>';
  }

  function render(el) {
    var st = Store.get();
    var today = Core.ymd(new Date());
    var s = Core.devStats(st.dev.items, { today: today, weekStart: st.settings.weekStart });

    var items = st.dev.items.filter(function (i) {
      if (filterProject !== 'all' && i.projectId !== filterProject) return false;
      if (filterType !== 'all' && i.type !== filterType) return false;
      return true;
    });

    var rank = { high: 0, mid: 1, low: 2 };
    function sortItems(list) {
      return list.slice().sort(function (a, b) {
        var p = (rank[a.priority] || 1) - (rank[b.priority] || 1);
        if (p) return p;
        if (a.due && b.due) return a.due < b.due ? -1 : 1;
        if (a.due) return -1;
        if (b.due) return 1;
        return a.createdAt < b.createdAt ? 1 : -1;
      });
    }

    el.innerHTML =
      '<div class="grid g-4">' +
        UI.statCard('待办', s.todo, '还没开始', 'layers') +
        UI.statCard('进行中', s.doing, '评审中 ' + s.review + ' 项', 'play') +
        UI.statCard('本周完成', s.doneThisWeek, '累计完成 ' + s.done + ' / ' + s.total, 'check') +
        UI.statCard('逾期', '<span style="color:' + (s.overdue ? 'var(--danger)' : 'inherit') + '">' + s.overdue + '</span>', '3 天内到期 ' + s.dueSoon + ' 项', 'alert') +
      '</div>' +

      '<div class="card mt-16">' +
        '<div class="spread" style="flex-wrap:wrap;gap:10px">' +
          '<div class="row wrap">' +
            '<span class="small muted">项目</span>' +
            '<button class="chip ' + (filterProject === 'all' ? 'active' : '') + '" data-act="filter-proj" data-key="all">全部</button>' +
            st.dev.projects.map(function (p) {
              return '<button class="chip ' + (filterProject === p.id ? 'active' : '') + '" data-act="filter-proj" data-key="' + p.id + '">' +
                '<span style="width:7px;height:7px;border-radius:50%;background:' + p.color + '"></span>' + UI.esc(p.name) + '</button>';
            }).join('') +
            '<button class="chip" data-act="filter-proj" data-key="">未归类</button>' +
            '<button class="chip" data-act="manage-projects" title="管理项目">' + UI.icon('settings', 13) + '</button>' +
          '</div>' +
          '<div class="row">' +
            '<select class="select" id="typeFilter" style="width:120px;height:32px">' +
              '<option value="all">全部类型</option>' +
              Object.keys(TYPES).map(function (k) {
                return '<option value="' + k + '"' + (filterType === k ? ' selected' : '') + '>' + TYPES[k].name + '</option>';
              }).join('') +
            '</select>' +
            '<button class="btn btn-primary" data-act="add">' + UI.icon('plus', 15) + ' 新增工作项</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="kanban mt-16">' + STATUS.map(function (stg) {
        var list = sortItems(items.filter(function (i) { return i.status === stg.key; }));
        return '<div class="kcol">' +
          '<div class="kcol-head"><b>' + stg.name + '</b><span class="count">' + list.length + '</span></div>' +
          (list.length ? list.map(function (it) { return cardHTML(it, today); }).join('') : '<div class="kcol-empty">还没有工作项</div>') +
          '<button class="kcard-new mt-8" data-act="add" data-status="' + stg.key + '">+ 加到「' + stg.name + '」</button>' +
        '</div>';
      }).join('') + '</div>' +

      '<div class="hint-box mt-16">' + UI.icon('info') +
        '<div>用卡片底部的 ← → 移动状态；带截止日期且超期的会标红。需要今天做掉的事，点靶心图标加入今日计划。</div>' +
      '</div>';

    /* 事件 */
    var tf = el.querySelector('#typeFilter');
    tf.addEventListener('change', function () { filterType = tf.value; render(el); });

    UI.bind(el, 'click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.dataset.act;
      var id = btn.dataset.id;

      if (act === 'add') {
        itemForm(null);
      } else if (act === 'filter-proj') {
        filterProject = btn.dataset.key === 'all' ? 'all' : btn.dataset.key;
        render(el);
      } else if (act === 'manage-projects') {
        projectManager();
      } else if (act === 'edit') {
        itemForm(Core.byId(Store.get().dev.items, id));
      } else if (act === 'del') {
        UI.confirm({
          title: '删除工作项', message: '删除后无法恢复，确定要删除这条工作项吗？',
          confirmText: '删除', danger: true
        }).then(function (ok) {
          if (!ok) return;
          Store.update(function (s2) { s2.dev.items = s2.dev.items.filter(function (i) { return i.id !== id; }); }, 'dev-del');
          render(el);
        });
      } else if (act === 'move') {
        var dir = Number(btn.dataset.dir);
        var it = Core.byId(Store.get().dev.items, id);
        if (!it) return;
        var idx = STATUS.findIndex(function (s2) { return s2.key === it.status; });
        var next = STATUS[idx + dir];
        if (!next) return;
        Store.update(function (s2) {
          var t = Core.byId(s2.dev.items, id);
          if (!t) return;
          t.status = next.key;
          t.doneAt = next.key === 'done' ? Core.nowISO() : '';
        }, 'dev-move');
        render(el);
      } else if (act === 'plan') {
        var item = Core.byId(Store.get().dev.items, id);
        if (!item) return;
        var proj = projectOf(item.projectId);
        UI.addToPlan({
          title: item.title,
          module: 'dev',
          refId: item.id,
          priority: item.priority,
          note: proj ? proj.name : ''
        });
        render(el);
      }
    });
  }

  window.Views.dev = {
    title: '开发工作',
    sub: '项目 + 工作项看板 · 按状态推进，逾期自动标红',
    render: render
  };
})();

</script>
<script>
/*!
 * views/consult.js — 咨询工作：客户档案 + 咨询记录 + 收入
 */
window.Views = window.Views || {};
(function () {
  'use strict';
  var Core = window.Core, Store = window.Store, UI = window.UI;

  var tab = 'clients';
  var stageFilter = 'all';

  var STAGES = [
    { key: 'lead', name: '线索', cls: '', color: '#94a3b8' },
    { key: 'talking', name: '沟通中', cls: 'info', color: '#0ea5e9' },
    { key: 'signed', name: '已签约', cls: 'brand', color: '#6366f1' },
    { key: 'delivering', name: '交付中', cls: 'warn', color: '#f59e0b' },
    { key: 'done', name: '已结案', cls: 'ok', color: '#10b981' },
    { key: 'lost', name: '已流失', cls: 'danger', color: '#ef4444' }
  ];

  function stageOf(k) {
    return STAGES.find(function (s) { return s.key === k; }) || STAGES[0];
  }

  function clientOpts() {
    return Store.get().consult.clients.map(function (c) { return { v: c.id, t: c.name + (c.company ? ' · ' + c.company : '') }; });
  }

  function stageOpts() {
    return STAGES.map(function (s) { return { v: s.key, t: s.name }; });
  }

  /* ---- 表单 ---- */

  function clientForm(client) {
    UI.formModal({
      title: client ? '编辑客户' : '新增客户',
      desc: '客户阶段用来区分线索、沟通过、已签约和已结案',
      fields: [
        { key: 'name', label: '姓名 / 称呼', type: 'text', required: true, placeholder: '例如：张先生' },
        { key: 'company', label: '公司 / 身份', type: 'text', placeholder: '例如：某教育公司 运营负责人' },
        { key: 'contact', label: '联系方式', type: 'text', placeholder: '微信 / 手机 / 邮箱' },
        { key: 'stage', label: '阶段', type: 'select', options: stageOpts() },
        { key: 'tags', label: '标签（逗号分隔）', type: 'text', placeholder: '例如：转介绍, 长期' },
        { key: 'note', label: '备注', type: 'textarea', span: 2 }
      ],
      values: client || { name: '', company: '', contact: '', stage: 'lead', tags: '', note: '' },
      onSubmit: function (v) {
        Store.update(function (s) {
          if (client) {
            var c = Core.byId(s.consult.clients, client.id);
            if (c) { c.name = v.name; c.company = v.company; c.contact = v.contact; c.stage = v.stage; c.tags = v.tags; c.note = v.note; }
          } else {
            s.consult.clients.push({
              id: Core.uid('client'), name: v.name, company: v.company, contact: v.contact,
              stage: v.stage, tags: v.tags, note: v.note, createdAt: Core.nowISO()
            });
          }
        }, 'consult-client');
        window.App.refresh();
      }
    });
  }

  function sessionForm(session) {
    var clients = Store.get().consult.clients;
    if (!clients.length) {
      UI.toast('先添加一位客户，再记录咨询', 'err');
      return;
    }
    UI.formModal({
      title: session ? '编辑咨询记录' : '新增咨询记录',
      wide: true,
      fields: [
        { key: 'clientId', label: '客户', type: 'select', options: clientOpts() },
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'minutes', label: '时长（分钟）', type: 'number', min: 0, step: 5 },
        { key: 'fee', label: '费用（元）', type: 'number', min: 0, step: 50 },
        { key: 'topic', label: '主题', type: 'text', span: 2, placeholder: '例如：第三季度增长方案复盘' },
        { key: 'note', label: '备注 / 结论', type: 'textarea', span: 2 }
      ],
      values: session || {
        clientId: clients[0].id, date: Core.ymd(new Date()), minutes: 60, fee: 0, topic: '', note: ''
      },
      onSubmit: function (v) {
        Store.update(function (s) {
          if (session) {
            var x = Core.byId(s.consult.sessions, session.id);
            if (x) {
              x.clientId = v.clientId; x.date = v.date; x.minutes = v.minutes;
              x.fee = v.fee; x.topic = v.topic; x.note = v.note;
            }
          } else {
            s.consult.sessions.push({
              id: Core.uid('session'), clientId: v.clientId, date: v.date,
              minutes: v.minutes, fee: v.fee, topic: v.topic, note: v.note
            });
          }
        }, 'consult-session');
        window.App.refresh();
        UI.toast('咨询记录已保存', 'ok', 1500);
      }
    });
  }

  /* ---- 渲染 ---- */

  function clientTable(st, stats) {
    var clients = st.consult.clients.filter(function (c) {
      return stageFilter === 'all' || c.stage === stageFilter;
    });
    clients = clients.slice().sort(function (a, b) {
      var ai = STAGES.findIndex(function (s) { return s.key === a.stage; });
      var bi = STAGES.findIndex(function (s) { return s.key === b.stage; });
      if (ai !== bi) return ai - bi;
      return a.createdAt < b.createdAt ? 1 : -1;
    });

    if (!clients.length) {
      return UI.emptyState('users', '还没有客户', '点右上角「新增客户」，把线索、沟通中、已签约的客户都记下来',
        '<button class="btn btn-primary btn-sm" data-act="add-client">+ 新增客户</button>');
    }

    return '<div class="table-scroll"><table class="table">' +
      '<thead><tr><th>客户</th><th>联系方式</th><th>阶段</th><th class="num">咨询次数</th>' +
      '<th class="num">累计费用</th><th>最近咨询</th><th style="width:120px"></th></tr></thead><tbody>' +
      clients.map(function (c) {
        var pc = stats.perClient[c.id] || { count: 0, fee: 0, lastDate: '' };
        var sg = stageOf(c.stage);
        return '<tr>' +
          '<td><div style="font-weight:600">' + UI.esc(c.name) + '</div>' +
            '<div class="small muted">' + UI.esc(c.company || '—') + '</div></td>' +
          '<td class="small dim">' + UI.esc(c.contact || '—') + '</td>' +
          '<td><span class="tag" style="background:color-mix(in srgb, ' + sg.color + ' 14%, transparent);color:' + sg.color + '">' + sg.name + '</span></td>' +
          '<td class="num">' + pc.count + '</td>' +
          '<td class="num">' + Core.fmtMoney(pc.fee) + '</td>' +
          '<td class="small dim mono">' + (pc.lastDate ? Core.fmtDateShort(pc.lastDate) : '—') + '</td>' +
          '<td><div class="row" style="justify-content:flex-end;gap:0">' +
            '<button class="icon-btn" data-act="plan" data-id="' + c.id + '" title="加入今日计划">' + UI.icon('target', 14) + '</button>' +
            '<button class="icon-btn" data-act="edit-client" data-id="' + c.id + '" title="编辑">' + UI.icon('edit', 14) + '</button>' +
            '<button class="icon-btn danger" data-act="del-client" data-id="' + c.id + '" title="删除">' + UI.icon('trash', 14) + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  function sessionTable(st) {
    var list = st.consult.sessions.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (!list.length) {
      return UI.emptyState('clock', '还没有咨询记录', '每次咨询结束后记一条：时长、主题、费用',
        '<button class="btn btn-primary btn-sm" data-act="add-session">+ 新增咨询记录</button>');
    }
    return '<div class="table-scroll"><table class="table">' +
      '<thead><tr><th>日期</th><th>客户</th><th class="num">时长</th><th>主题</th><th class="num">费用</th><th></th></tr></thead><tbody>' +
      list.map(function (sx) {
        var c = Core.byId(st.consult.clients, sx.clientId);
        return '<tr>' +
          '<td class="mono small">' + Core.fmtDateShort(sx.date) + '</td>' +
          '<td>' + (c ? UI.esc(c.name) : '<span class="muted">已删除的客户</span>') + '</td>' +
          '<td class="num">' + Core.fmtDuration(sx.minutes) + '</td>' +
          '<td><div class="truncate" style="max-width:240px">' + UI.esc(sx.topic || '—') + '</div></td>' +
          '<td class="num">' + Core.fmtMoney(sx.fee) + '</td>' +
          '<td><div class="row" style="justify-content:flex-end;gap:0">' +
            '<button class="icon-btn" data-act="edit-session" data-id="' + sx.id + '">' + UI.icon('edit', 14) + '</button>' +
            '<button class="icon-btn danger" data-act="del-session" data-id="' + sx.id + '">' + UI.icon('trash', 14) + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  function render(el) {
    var st = Store.get();
    var stats = Core.consultStats(st.consult.clients, st.consult.sessions, {});

    el.innerHTML =
      '<div class="grid g-4">' +
        UI.statCard('客户总数', stats.totalClients, '活跃 ' + stats.active + ' 位', 'users') +
        UI.statCard('本月收入', Core.fmtMoney(stats.monthRevenue), stats.monthSessions + ' 次咨询', 'chart') +
        UI.statCard('累计收入', Core.fmtMoney(stats.revenue), '均价 ' + Core.fmtMoney(stats.avgFee), 'target') +
        UI.statCard('累计时长', stats.hours + ' h', '共 ' + stats.sessionCount + ' 次咨询', 'clock') +
      '</div>' +

      '<div class="card mt-16">' +
        '<div class="spread" style="flex-wrap:wrap;gap:10px">' +
          '<div class="segmented">' +
            '<button data-act="tab" data-tab="clients" class="' + (tab === 'clients' ? 'active' : '') + '">客户（' + st.consult.clients.length + '）</button>' +
            '<button data-act="tab" data-tab="sessions" class="' + (tab === 'sessions' ? 'active' : '') + '">咨询记录（' + st.consult.sessions.length + '）</button>' +
          '</div>' +
          '<div class="row">' +
            '<button class="btn btn-sm" data-act="add-session">' + UI.icon('clock', 14) + ' 新增咨询记录</button>' +
            '<button class="btn btn-primary btn-sm" data-act="add-client">' + UI.icon('plus', 14) + ' 新增客户</button>' +
          '</div>' +
        '</div>' +

        (tab === 'clients' ? (
          '<div class="row wrap mt-12" style="margin-bottom:10px">' +
            '<button class="chip ' + (stageFilter === 'all' ? 'active' : '') + '" data-act="stage" data-key="all">全部</button>' +
            STAGES.map(function (s) {
              return '<button class="chip ' + (stageFilter === s.key ? 'active' : '') + '" data-act="stage" data-key="' + s.key + '">' +
                s.name + ' <span class="muted">' + stats.byStage[s.key] + '</span></button>';
            }).join('') +
          '</div>' + clientTable(st, stats)
        ) : sessionTable(st)) +
      '</div>' +

      '<div class="hint-box mt-16">' + UI.icon('info') +
        '<div>删除客户时，会一并删除该客户名下的 ' +
        '<b>咨询记录</b>；只想停用客户的话，把阶段改成「已流失」或「已结案」更安全。</div>' +
      '</div>';

    el.querySelectorAll('[data-act="tab"]').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.dataset.tab; render(el); });
    });

    UI.bind(el, 'click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.dataset.act, id = btn.dataset.id;
      var s2 = Store.get();

      if (act === 'tab') return;

      if (act === 'add-client') clientForm(null);
      else if (act === 'add-session') sessionForm(null);
      else if (act === 'edit-client') clientForm(Core.byId(s2.consult.clients, id));
      else if (act === 'edit-session') sessionForm(Core.byId(s2.consult.sessions, id));
      else if (act === 'stage') { stageFilter = btn.dataset.key; render(el); }
      else if (act === 'plan') {
        var c = Core.byId(s2.consult.clients, id);
        if (!c) return;
        UI.addToPlan({ title: '跟进客户：' + c.name, module: 'consult', refId: 'client:' + c.id, note: c.company || '' });
        render(el);
      } else if (act === 'del-client') {
        var count = s2.consult.sessions.filter(function (x) { return x.clientId === id; }).length;
        var cl = Core.byId(s2.consult.clients, id);
        UI.confirm({
          title: '删除客户',
          message: '确定删除客户「' + UI.esc(cl ? cl.name : '') + '」吗？' +
            (count ? '该客户名下的 <b>' + count + '</b> 条咨询记录也会一起删除，且无法恢复。' : ''),
          confirmText: '删除客户',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          Store.update(function (s) {
            s.consult.clients = s.consult.clients.filter(function (x) { return x.id !== id; });
            s.consult.sessions = s.consult.sessions.filter(function (x) { return x.clientId !== id; });
          }, 'consult-del-client');
          render(el);
          UI.toast('客户已删除', 'ok', 1500);
        });
      } else if (act === 'del-session') {
        UI.confirm({
          title: '删除咨询记录', message: '删除后无法恢复，收入统计会同步减少。',
          confirmText: '删除', danger: true
        }).then(function (ok) {
          if (!ok) return;
          Store.update(function (s) { s.consult.sessions = s.consult.sessions.filter(function (x) { return x.id !== id; }); }, 'consult-del-session');
          render(el);
        });
      }
    });
  }

  window.Views.consult = {
    title: '咨询工作',
    sub: '客户档案 + 每次咨询记录 · 阶段推进与收入一眼看清',
    render: render
  };
})();

</script>
<script>
/*!
 * views/fitness.js — 健身计划：月历 + 当日训练（部位/动作/组数/次数）
 */
window.Views = window.Views || {};
(function () {
  'use strict';
  var Core = window.Core, Store = window.Store, UI = window.UI;

  var today = Core.ymd(new Date());
  var month = Core.monthOf(today);
  var selected = today;

  var PARTS = [
    { key: 'chest', name: '胸', color: '#ef4444' },
    { key: 'back', name: '背', color: '#6366f1' },
    { key: 'legs', name: '腿', color: '#f59e0b' },
    { key: 'shoulders', name: '肩', color: '#0ea5e9' },
    { key: 'arms', name: '手臂', color: '#8b5cf6' },
    { key: 'core', name: '核心', color: '#10b981' },
    { key: 'cardio', name: '有氧', color: '#ec4899' }
  ];

  function partOf(k) {
    return PARTS.find(function (p) { return p.key === k; }) || PARTS[0];
  }

  function partOpts() {
    return PARTS.map(function (p) { return { v: p.key, t: p.name }; });
  }

  function fitForm(session) {
    UI.formModal({
      title: session ? '编辑训练动作' : '记录训练动作',
      desc: '日期：' + Core.fmtDateCN(session ? session.date : selected),
      fields: [
        { key: 'part', label: '训练部位', type: 'select', options: partOpts() },
        { key: 'exercise', label: '动作名称', type: 'text', required: true, placeholder: '例如：杠铃卧推' },
        { key: 'sets', label: '组数', type: 'number', min: 0, step: 1 },
        { key: 'reps', label: '每组次数', type: 'number', min: 0, step: 1 },
        { key: 'weight', label: '重量（kg，可选）', type: 'number', min: 0, step: 2.5, hint: '自重动作填 0' },
        { key: 'note', label: '备注（可选）', type: 'text' }
      ],
      values: session || { part: 'chest', exercise: '', sets: 4, reps: 10, weight: 0, note: '' },
      onSubmit: function (v) {
        Store.update(function (s) {
          if (session) {
            var it = Core.byId(s.fitness.sessions, session.id);
            if (it) {
              it.part = v.part; it.exercise = v.exercise; it.sets = v.sets;
              it.reps = v.reps; it.weight = v.weight; it.note = v.note;
            }
          } else {
            s.fitness.sessions.push({
              id: Core.uid('fit'), date: selected, part: v.part, exercise: v.exercise,
              sets: v.sets, reps: v.reps, weight: v.weight, note: v.note, createdAt: Core.nowISO()
            });
          }
        }, 'fitness-session');
        window.App.refresh();
      }
    });
  }

  function cellHtml(date, byDate) {
    var d = byDate[date];
    if (!d) return '';
    var parts = Object.keys(d.parts).sort(function (a, b) { return d.parts[b] - d.parts[a]; }).slice(0, 2);
    return '<span class="chips">' + parts.map(function (k) {
      var p = partOf(k);
      return '<span class="dot-chip" style="background:color-mix(in srgb, ' + p.color + ' 15%, transparent);color:' + p.color + '">' +
        p.name + ' ' + d.parts[k] + '组</span>';
    }).join('') + '</span>' +
      '<span class="mini">' + d.count + ' 个动作' + (parts.length < Object.keys(d.parts).length ? ' · 等' : '') + '</span>';
  }

  function render(el) {
    var st = Store.get();
    var y = Number(month.slice(0, 4)), m = Number(month.slice(5, 7));
    var stats = Core.fitnessStats(st.fitness.sessions, { today: today, month: month, weekStart: st.settings.weekStart });
    var dayList = st.fitness.sessions.filter(function (s) { return s.date === selected; });
    var daySets = Core.sum(dayList, function (s) { return s.sets; });
    var dayVolume = Math.round(Core.sum(dayList, function (s) { return s.sets * s.reps * s.weight; }));

    el.innerHTML =
      '<div class="grid g-4">' +
        UI.statCard('本月训练', stats.monthDays + ' 天', '共 ' + stats.monthSessions + ' 个动作 · ' + stats.monthSets + ' 组', 'calendar') +
        UI.statCard('连续打卡', stats.streak + ' 天', stats.streak >= 3 ? '保持住，别断' : '今天练一下就开始了', 'flame') +
        UI.statCard('本周训练', stats.weekDays + ' 天', stats.weekSessions + ' 个动作', 'target') +
        UI.statCard('累计容量', Core.fmtNum(stats.volume) + ' kg', '组数 × 次数 × 重量', 'chart') +
      '</div>' +

      '<div class="grid mt-16" style="grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start">' +
        '<div class="card">' +
          '<div class="cal-head">' +
            '<div class="row">' +
              '<button class="icon-btn" data-act="prev-month">' + UI.icon('chevronLeft', 17) + '</button>' +
              '<div class="cal-title">' + Core.fmtMonthCN(month) + '</div>' +
              '<button class="icon-btn" data-act="next-month">' + UI.icon('chevronRight', 17) + '</button>' +
            '</div>' +
            '<div class="row">' +
              '<button class="btn btn-sm" data-act="this-month">本月</button>' +
              '<button class="btn btn-primary btn-sm" data-act="add">' + UI.icon('plus', 14) + ' 记录训练</button>' +
            '</div>' +
          '</div>' +
          '<div class="cal-head" style="margin-bottom:6px"><span class="small muted">点日期查看/记录当天训练；格子里是部位与组数</span></div>' +
          UI.calendar({
            year: y, month: m, weekStart: st.settings.weekStart, selected: selected,
            cellHtml: function (date) { return cellHtml(date, stats.byDate); }
          }) +
          '<div class="chart-legend" style="margin-top:12px">' + PARTS.map(function (p) {
            return '<span><i style="background:' + p.color + '"></i>' + p.name + '</span>';
          }).join('') + '</div>' +
        '</div>' +

        '<div class="stack">' +
          '<div class="card">' +
            '<div class="card-head">' +
              '<div class="card-title">' + UI.icon('dumbbell') + ' ' + Core.fmtDateCN(selected) + (selected === today ? ' <span class="tag brand">今天</span>' : '') + '</div>' +
              '<div class="row"><button class="btn btn-sm btn-soft" data-act="add">' + UI.icon('plus', 13) + ' 动作</button></div>' +
            '</div>' +
            (dayList.length ? (
              '<div class="row wrap" style="gap:6px;margin-bottom:10px">' +
                '<span class="tag">' + dayList.length + ' 个动作</span>' +
                '<span class="tag">' + daySets + ' 组</span>' +
                (dayVolume ? '<span class="tag">' + Core.fmtNum(dayVolume) + ' kg</span>' : '') +
              '</div>' +
              dayList.map(function (s) {
                var p = partOf(s.part);
                return '<div class="timeline-item">' +
                  '<span class="tag" style="background:color-mix(in srgb, ' + p.color + ' 14%, transparent);color:' + p.color + ';height:22px">' + p.name + '</span>' +
                  '<div class="grow"><div style="font-size:13px;font-weight:550">' + UI.esc(s.exercise) + '</div>' +
                    '<div class="small muted">' + s.sets + ' 组 × ' + s.reps + ' 次' + (s.weight ? ' · ' + s.weight + ' kg' : ' · 自重') + '</div></div>' +
                  '<div class="row" style="gap:0">' +
                    '<button class="icon-btn" data-act="edit" data-id="' + s.id + '">' + UI.icon('edit', 14) + '</button>' +
                    '<button class="icon-btn danger" data-act="del" data-id="' + s.id + '">' + UI.icon('trash', 14) + '</button>' +
                  '</div></div>';
              }).join('') +
              '<div class="mt-12"><button class="btn btn-sm" data-act="plan">' + UI.icon('target', 13) + ' 加入今日计划</button></div>'
            ) : UI.emptyState('dumbbell', '这天还没有训练记录', '点「记录训练」，写下部位、动作、组数和次数')) +
          '</div>' +

          '<div class="card">' +
            '<div class="card-head"><div class="card-title">' + UI.icon('calendar') + ' 本周概览</div>' +
              '<span class="small muted">' + stats.weekDays + ' / 7 天</span></div>' +
            Core.weekDates(today, st.settings.weekStart).map(function (dt) {
              var rec = stats.byDate[dt];
              var names = rec ? Object.keys(rec.parts).map(function (k) { return partOf(k).name; }) : [];
              return '<div class="spread" style="padding:5px 0;border-bottom:1px dashed var(--border)">' +
                '<span class="small ' + (dt === today ? '' : 'dim') + '">' + (dt === today ? '今天' : Core.fmtDateShort(dt)) + '</span>' +
                (rec ? '<span class="small">' + names.join(' / ') + ' · ' + rec.sets + ' 组</span>'
                  : '<span class="small muted">休息</span>') +
              '</div>';
            }).join('') +
          '</div>' +

          '<div class="card">' +
            '<div class="card-head"><div class="card-title">' + UI.icon('chart') + ' 部位组数分布</div><span class="small muted">累计</span></div>' +
            UI.barsH(stats.byPart.map(function (p) {
              return { label: partOf(p.part).name, value: p.sets, color: partOf(p.part).color };
            }), { format: function (v) { return v + ' 组'; }, emptyHint: '记录训练后显示' }) +
          '</div>' +
        '</div>' +
      '</div>';

    /* 事件 */
    UI.bind(el, 'click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.dataset.act, id = btn.dataset.id;

      if (act === 'pick-day') {
        selected = btn.dataset.date;
        if (btn.dataset.date.slice(0, 7) !== month) month = btn.dataset.date.slice(0, 7);
        render(el);
      } else if (act === 'prev-month') {
        month = Core.addMonths(month, -1); render(el);
      } else if (act === 'next-month') {
        month = Core.addMonths(month, 1); render(el);
      } else if (act === 'this-month') {
        month = Core.monthOf(today); selected = today; render(el);
      } else if (act === 'add') {
        fitForm(null);
      } else if (act === 'edit') {
        fitForm(Core.byId(Store.get().fitness.sessions, id));
      } else if (act === 'del') {
        Store.update(function (s) { s.fitness.sessions = s.fitness.sessions.filter(function (x) { return x.id !== id; }); }, 'fitness-del');
        render(el);
      } else if (act === 'plan') {
        var parts = {};
        dayList.forEach(function (s) { parts[partOf(s.part).name] = true; });
        UI.addToPlan({
          title: '训练：' + Object.keys(parts).join('/') + '（' + dayList.length + ' 个动作）',
          module: 'fitness',
          refId: 'fit:' + selected,
          note: daySets + ' 组'
        });
        render(el);
      }
    });
  }

  window.Views.fitness = {
    title: '健身计划',
    sub: '月历记录每天练了什么部位、哪些动作、几组几次',
    render: render
  };
})();

</script>
<script>
/*!
 * views/diet.js — 饮食计划：月历 + 当日餐次 / 营养素 / 饮水
 */
window.Views = window.Views || {};
(function () {
  'use strict';
  var Core = window.Core, Store = window.Store, UI = window.UI;

  var today = Core.ymd(new Date());
  var month = Core.monthOf(today);
  var selected = today;

  var TYPES = [
    { key: 'breakfast', name: '早餐', icon: 'coffee', color: '#f59e0b' },
    { key: 'lunch', name: '午餐', icon: 'utensils', color: '#0ea5e9' },
    { key: 'dinner', name: '晚餐', icon: 'utensils', color: '#8b5cf6' },
    { key: 'snack', name: '加餐', icon: 'apple', color: '#10b981' }
  ];

  function typeOf(k) {
    return TYPES.find(function (t) { return t.key === k; }) || TYPES[1];
  }

  function mealForm(meal, presetType) {
    UI.formModal({
      title: meal ? '编辑餐次' : '记录一餐',
      desc: '日期：' + Core.fmtDateCN(meal ? meal.date : selected),
      wide: true,
      fields: [
        { key: 'type', label: '餐次', type: 'select', options: TYPES.map(function (t) { return { v: t.key, t: t.name }; }) },
        { key: 'name', label: '吃了什么', type: 'text', required: true, placeholder: '例如：鸡胸肉沙拉' },
        { key: 'kcal', label: '热量（kcal）', type: 'number', min: 0, step: 10 },
        { key: 'protein', label: '蛋白质（g）', type: 'number', min: 0, step: 1 },
        { key: 'carbs', label: '碳水（g）', type: 'number', min: 0, step: 1 },
        { key: 'fat', label: '脂肪（g）', type: 'number', min: 0, step: 1 },
        { key: 'note', label: '备注（可选）', type: 'text', span: 2 }
      ],
      values: meal || { type: presetType || 'lunch', name: '', kcal: 0, protein: 0, carbs: 0, fat: 0, note: '' },
      onSubmit: function (v) {
        Store.update(function (s) {
          if (meal) {
            var m2 = Core.byId(s.diet.meals, meal.id);
            if (m2) {
              m2.type = v.type; m2.name = v.name; m2.kcal = v.kcal;
              m2.protein = v.protein; m2.carbs = v.carbs; m2.fat = v.fat; m2.note = v.note;
            }
          } else {
            s.diet.meals.push({
              id: Core.uid('meal'), date: selected, type: v.type, name: v.name,
              kcal: v.kcal, protein: v.protein, carbs: v.carbs, fat: v.fat, note: v.note
            });
          }
        }, 'diet-meal');
        window.App.refresh();
      }
    });
  }

  function targetForm() {
    var t = Store.get().settings.dietTargets;
    UI.formModal({
      title: '每日目标',
      desc: '用于计算进度条与「还可摄入多少」',
      fields: [
        { key: 'kcal', label: '热量目标（kcal）', type: 'number', min: 0, step: 50 },
        { key: 'water', label: '饮水目标（ml）', type: 'number', min: 0, step: 250 },
        { key: 'protein', label: '蛋白质目标（g）', type: 'number', min: 0, step: 5 },
        { key: 'carbs', label: '碳水目标（g）', type: 'number', min: 0, step: 5 },
        { key: 'fat', label: '脂肪目标（g）', type: 'number', min: 0, step: 5 }
      ],
      values: t,
      onSubmit: function (v) {
        Store.update(function (s) {
          s.settings.dietTargets = { kcal: v.kcal, water: v.water, protein: v.protein, carbs: v.carbs, fat: v.fat };
        }, 'diet-target');
        window.App.refresh();
        UI.toast('每日目标已更新', 'ok', 1500);
      }
    });
  }

  function cellHtml(date) {
    var st = Store.get();
    var kcal = Core.sum(st.diet.meals.filter(function (m) { return m.date === date; }), function (m) { return m.kcal; });
    var target = Core.num(st.settings.dietTargets.kcal, 2000) || 1;
    if (!kcal) return '';
    var pct = Math.min(100, Math.round((kcal / target) * 100));
    var over = kcal > target;
    return '<span style="font-size:10.5px;font-weight:600;color:' + (over ? 'var(--danger)' : 'var(--text-dim)') + '">' + Core.fmtNum(kcal) + '</span>' +
      '<span style="display:block;height:3px;border-radius:99px;background:var(--surface-3);margin-top:2px;overflow:hidden">' +
      '<i style="display:block;height:100%;width:' + pct + '%;background:' + (over ? 'var(--danger)' : 'linear-gradient(90deg,#34d399,#10b981)') + '"></i></span>';
  }

  function macroRow(label, value, target, unit, color) {
    var pct = target ? Math.round((value / target) * 100) : 0;
    return '<div style="margin-bottom:9px">' +
      '<div class="spread small" style="margin-bottom:4px"><span class="dim">' + label + '</span>' +
        '<span class="mono">' + Core.round1(value) + ' / ' + target + ' ' + unit + '</span></div>' +
      '<div class="progress" style="height:5px"><i style="width:' + Math.min(100, pct) + '%;background:' + color + '"></i></div>' +
    '</div>';
  }

  function render(el) {
    var st = Store.get();
    var targets = st.settings.dietTargets;
    var d = Core.dietDay(st.diet.meals, selected, targets, st.diet.water[selected]);
    var y = Number(month.slice(0, 4)), m = Number(month.slice(5, 7));
    var week = Core.weekDates(selected, st.settings.weekStart);
    var weekStat = Core.dietRange(st.diet.meals, week, targets);

    el.innerHTML =
      '<div class="grid g-4">' +
        UI.statCard('今日摄入', '<span style="color:' + (d.kcal > d.kcalTarget ? 'var(--danger)' : 'inherit') + '">' + Core.fmtNum(d.kcal) + '</span> kcal',
          '目标 ' + Core.fmtNum(d.kcalTarget) + ' kcal', 'flame') +
        UI.statCard('剩余可摄入', Core.fmtNum(Math.abs(d.remaining)) + ' kcal', d.remaining >= 0 ? '还可以吃点' : '已超出目标', 'target') +
        UI.statCard('蛋白质', d.protein + ' g', '目标 ' + targets.protein + ' g', 'dumbbell') +
        UI.statCard('本周日均', Core.fmtNum(weekStat.avgKcal) + ' kcal', '记录 ' + weekStat.loggedDays + ' / 7 天', 'chart') +
      '</div>' +

      '<div class="grid mt-16" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start">' +
        '<div class="card">' +
          '<div class="cal-head">' +
            '<div class="row">' +
              '<button class="icon-btn" data-act="prev-month">' + UI.icon('chevronLeft', 17) + '</button>' +
              '<div class="cal-title">' + Core.fmtMonthCN(month) + '</div>' +
              '<button class="icon-btn" data-act="next-month">' + UI.icon('chevronRight', 17) + '</button>' +
            '</div>' +
            '<div class="row">' +
              '<button class="btn btn-sm" data-act="targets">' + UI.icon('target', 14) + ' 每日目标</button>' +
              '<button class="btn btn-primary btn-sm" data-act="add">' + UI.icon('plus', 14) + ' 记录饮食</button>' +
            '</div>' +
          '</div>' +
          '<div class="cal-head" style="margin-bottom:6px"><span class="small muted">点日期查看当天饮食；格子里是当天摄入热量</span></div>' +
          UI.calendar({
            year: y, month: m, weekStart: st.settings.weekStart, selected: selected,
            cellHtml: cellHtml
          }) +
        '</div>' +

        '<div class="stack">' +
          '<div class="card">' +
            '<div class="card-head">' +
              '<div class="card-title">' + UI.icon('utensils') + ' ' + Core.fmtDateCN(selected) + (selected === today ? ' <span class="tag brand">今天</span>' : '') + '</div>' +
              '<div class="row"><button class="btn btn-sm btn-soft" data-act="add">' + UI.icon('plus', 13) + ' 一餐</button></div>' +
            '</div>' +
            '<div class="row" style="gap:14px;margin-bottom:12px">' +
              UI.ring(d.pct, { size: 66, stroke: 7, color: d.kcal > d.kcalTarget ? 'var(--danger)' : 'var(--brand)' }) +
              '<div class="grow">' +
                '<div style="font-size:19px;font-weight:700;letter-spacing:-.02em" class="mono">' + Core.fmtNum(d.kcal) + ' <span style="font-size:12px;color:var(--text-mute)">/ ' + Core.fmtNum(d.kcalTarget) + ' kcal</span></div>' +
                '<div class="small ' + (d.remaining >= 0 ? 'muted' : '') + '" style="color:' + (d.remaining >= 0 ? '' : 'var(--danger)') + '">' +
                  (d.remaining >= 0 ? '还可摄入 ' + Core.fmtNum(d.remaining) + ' kcal' : '超出 ' + Core.fmtNum(-d.remaining) + ' kcal') + '</div>' +
              '</div>' +
            '</div>' +
            macroRow('蛋白质', d.protein, targets.protein, 'g', 'linear-gradient(90deg,#38bdf8,#0ea5e9)') +
            macroRow('碳水', d.carbs, targets.carbs, 'g', 'linear-gradient(90deg,#fbbf24,#f59e0b)') +
            macroRow('脂肪', d.fat, targets.fat, 'g', 'linear-gradient(90deg,#a78bfa,#8b5cf6)') +
            '<div class="divider"></div>' +
            '<div class="spread">' +
              '<div><div class="small dim">饮水</div><div class="mono" style="font-size:15px;font-weight:650">' + d.water + ' ml</div></div>' +
              '<div class="row">' +
                '<button class="btn btn-sm" data-act="water-minus">−250ml</button>' +
                '<button class="btn btn-sm btn-soft" data-act="water-plus">+250ml</button>' +
              '</div>' +
            '</div>' +
            '<div class="progress mt-8" style="height:5px"><i style="width:' + Math.min(100, d.waterPct) + '%;background:linear-gradient(90deg,#67e8f9,#06b6d4)"></i></div>' +
          '</div>' +

          '<div class="card">' +
            '<div class="card-head"><div class="card-title">' + UI.icon('layers') + ' 当天餐次 <span class="tag">' + d.count + '</span></div></div>' +
            (d.count ? TYPES.map(function (t) {
              var list = d.byMeal[t.key] || [];
              if (!list.length) return '';
              var cal = Core.sum(list, function (m3) { return m3.kcal; });
              return '<div style="margin-bottom:12px">' +
                '<div class="spread" style="margin-bottom:4px"><b style="font-size:12.5px">' + t.name + '</b>' +
                  '<span class="small muted">' + Core.fmtNum(cal) + ' kcal</span></div>' +
                list.map(function (m3) {
                  return '<div class="timeline-item" style="padding:6px 0">' +
                    '<div class="grow"><div style="font-size:12.5px">' + UI.esc(m3.name) + '</div>' +
                      '<div class="small muted">蛋白 ' + m3.protein + 'g · 碳水 ' + m3.carbs + 'g · 脂肪 ' + m3.fat + 'g</div></div>' +
                    '<div class="row" style="gap:0">' +
                      '<button class="icon-btn" data-act="edit" data-id="' + m3.id + '">' + UI.icon('edit', 13) + '</button>' +
                      '<button class="icon-btn danger" data-act="del" data-id="' + m3.id + '">' + UI.icon('trash', 13) + '</button>' +
                    '</div></div>';
                }).join('') +
              '</div>';
            }).join('')
              : UI.emptyState('utensils', '这天还没有记录', '点「记录饮食」把三餐记下来，热量和营养素会自动算')) +
          '</div>' +
        '</div>' +
      '</div>';

    UI.bind(el, 'click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.dataset.act, id = btn.dataset.id;

      if (act === 'pick-day') {
        selected = btn.dataset.date;
        if (btn.dataset.date.slice(0, 7) !== month) month = btn.dataset.date.slice(0, 7);
        render(el);
      } else if (act === 'prev-month') {
        month = Core.addMonths(month, -1); render(el);
      } else if (act === 'next-month') {
        month = Core.addMonths(month, 1); render(el);
      } else if (act === 'add') {
        mealForm(null);
      } else if (act === 'edit') {
        mealForm(Core.byId(Store.get().diet.meals, id));
      } else if (act === 'del') {
        Store.update(function (s) { s.diet.meals = s.diet.meals.filter(function (x) { return x.id !== id; }); }, 'diet-del');
        render(el);
      } else if (act === 'targets') {
        targetForm();
      } else if (act === 'water-plus' || act === 'water-minus') {
        var delta = act === 'water-plus' ? 250 : -250;
        Store.update(function (s) {
          s.diet.water[selected] = Math.max(0, Core.num(s.diet.water[selected]) + delta);
        }, 'diet-water');
        render(el);
      }
    });
  }

  window.Views.diet = {
    title: '饮食计划',
    sub: '月历记录每天吃了什么 · 热量、三大营养素与饮水一目了然',
    render: render
  };
})();

</script>
<script>
/*!
 * views/games.js — 游戏娱乐：游戏库 + 游玩时长
 */
window.Views = window.Views || {};
(function () {
  'use strict';
  var Core = window.Core, Store = window.Store, UI = window.UI;

  var filter = 'all';

  var STATUS = [
    { key: 'wish', name: '想玩', cls: '', color: '#94a3b8' },
    { key: 'playing', name: '在玩', cls: 'brand', color: '#7c3aed' },
    { key: 'done', name: '已通关', cls: 'ok', color: '#10b981' },
    { key: 'paused', name: '搁置', cls: 'warn', color: '#f59e0b' }
  ];

  var PLATFORMS = ['PC', 'Switch', 'PS5', 'Xbox', '手机', '其他'];

  function statusOf(k) {
    return STATUS.find(function (s) { return s.key === k; }) || STATUS[0];
  }

  function gameForm(game) {
    UI.formModal({
      title: game ? '编辑游戏' : '新增游戏',
      fields: [
        { key: 'name', label: '游戏名称', type: 'text', required: true, span: 2, placeholder: '例如：塞尔达传说 王国之泪' },
        { key: 'platform', label: '平台', type: 'select', options: PLATFORMS.map(function (p) { return { v: p, t: p }; }) },
        { key: 'status', label: '状态', type: 'select', options: STATUS.map(function (s) { return { v: s.key, t: s.name }; }) },
        { key: 'rating', label: '评分（0-10）', type: 'number', min: 0, max: 10, step: 0.5 },
        { key: 'hours', label: '已玩时长（小时）', type: 'number', min: 0, step: 0.5, hint: '记录游玩会在此基础上累加展示' },
        { key: 'note', label: '备注', type: 'textarea', span: 2 }
      ],
      values: game || { name: '', platform: 'PC', status: 'wish', rating: 0, hours: 0, note: '' },
      onSubmit: function (v) {
        Store.update(function (s) {
          if (game) {
            var g = Core.byId(s.games.games, game.id);
            if (g) { g.name = v.name; g.platform = v.platform; g.status = v.status; g.rating = v.rating; g.hours = v.hours; g.note = v.note; }
          } else {
            s.games.games.push({
              id: Core.uid('game'), name: v.name, platform: v.platform, status: v.status,
              rating: v.rating, hours: v.hours, note: v.note, createdAt: Core.nowISO()
            });
          }
        }, 'games-game');
        window.App.refresh();
      }
    });
  }

  function sessionForm(game) {
    var games = Store.get().games.games;
    if (!games.length) { UI.toast('先添加一款游戏', 'err'); return; }
    UI.formModal({
      title: '记录一次游玩',
      desc: '时长会累加到本周与总计统计中',
      fields: [
        { key: 'gameId', label: '游戏', type: 'select', options: games.map(function (g) { return { v: g.id, t: g.name }; }) },
        { key: 'date', label: '日期', type: 'date', required: true },
        { key: 'minutes', label: '时长（分钟）', type: 'number', min: 0, step: 5 },
        { key: 'note', label: '备注（可选）', type: 'text' }
      ],
      values: { gameId: game ? game.id : games[0].id, date: Core.ymd(new Date()), minutes: 60, note: '' },
      onSubmit: function (v) {
        Store.update(function (s) {
          s.games.sessions.push({ id: Core.uid('gsess'), gameId: v.gameId, date: v.date, minutes: v.minutes, note: v.note });
        }, 'games-session');
        window.App.refresh();
        UI.toast('已记录 ' + v.minutes + ' 分钟', 'ok', 1400);
      }
    });
  }

  function gameCard(g, stats) {
    var sg = statusOf(g.status);
    var played = Core.sum(Store.get().games.sessions.filter(function (s) { return s.gameId === g.id; }), function (s) { return s.minutes; });
    var totalHours = Core.round1((Core.num(g.hours) * 60 + played) / 60);
    return '<div class="card gcard" style="--accent:' + sg.color + '">' +
      '<div class="cover"><span>' + UI.esc(g.name) + '</span></div>' +
      '<div class="row wrap" style="gap:5px">' +
        '<span class="tag" style="background:color-mix(in srgb, ' + sg.color + ' 14%, transparent);color:' + sg.color + '">' + sg.name + '</span>' +
        '<span class="tag">' + UI.esc(g.platform) + '</span>' +
        (g.rating ? '<span class="stars">' + '★'.repeat(Math.round(g.rating / 2)) + '<span class="muted">' + g.rating + '</span></span>' : '') +
      '</div>' +
      '<div class="spread small"><span class="muted">累计游玩</span><b class="mono">' + totalHours + ' 小时</b></div>' +
      (g.note ? '<div class="small muted truncate" title="' + UI.esc(g.note) + '">' + UI.esc(g.note) + '</div>' : '') +
      '<div class="row" style="gap:6px;margin-top:2px">' +
        '<button class="btn btn-sm btn-soft grow" data-act="play" data-id="' + g.id + '">' + UI.icon('play', 13) + ' 记录游玩</button>' +
        '<button class="icon-btn" data-act="edit" data-id="' + g.id + '">' + UI.icon('edit', 14) + '</button>' +
        '<button class="icon-btn danger" data-act="del" data-id="' + g.id + '">' + UI.icon('trash', 14) + '</button>' +
      '</div>' +
    '</div>';
  }

  function render(el) {
    var st = Store.get();
    var stats = Core.gamesStats(st.games.games, st.games.sessions, { today: Core.ymd(new Date()), weekStart: st.settings.weekStart });
    var list = st.games.games.filter(function (g) { return filter === 'all' || g.status === filter; });

    var recent = st.games.sessions.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 8);

    el.innerHTML =
      '<div class="grid g-4">' +
        UI.statCard('在玩游戏', stats.byStatus.playing + ' 款', '想玩 ' + stats.byStatus.wish + ' · 通关 ' + stats.byStatus.done, 'gamepad') +
        UI.statCard('本周时长', stats.weekHours + ' h', stats.weekSessions + ' 次游玩', 'clock') +
        UI.statCard('累计时长', stats.totalHours + ' h', '共 ' + stats.total + ' 款游戏', 'chart') +
        UI.statCard('平均评分', stats.avgRating || '—', '仅统计已评分', 'star') +
      '</div>' +

      '<div class="card mt-16">' +
        '<div class="spread" style="flex-wrap:wrap;gap:10px">' +
          '<div class="row wrap">' +
            '<button class="chip ' + (filter === 'all' ? 'active' : '') + '" data-act="filter" data-key="all">全部 ' + stats.total + '</button>' +
            STATUS.map(function (s) {
              return '<button class="chip ' + (filter === s.key ? 'active' : '') + '" data-act="filter" data-key="' + s.key + '">' +
                s.name + ' ' + stats.byStatus[s.key] + '</button>';
            }).join('') +
          '</div>' +
          '<div class="row">' +
            '<button class="btn btn-sm" data-act="play">' + UI.icon('play', 14) + ' 记录游玩</button>' +
            '<button class="btn btn-primary btn-sm" data-act="add">' + UI.icon('plus', 14) + ' 新增游戏</button>' +
          '</div>' +
        '</div>' +
        (list.length ? '<div class="grid g-3 mt-16">' + list.map(function (g) { return gameCard(g, stats); }).join('') + '</div>'
          : '<div class="mt-16">' + UI.emptyState('gamepad', '这里还没有游戏', '把想玩、在玩的游戏加进来，记录时长后能看到本周投入') + '</div>') +
      '</div>' +

      '<div class="card mt-16">' +
        '<div class="card-head"><div class="card-title">' + UI.icon('clock') + ' 最近游玩</div><span class="small muted">最近 8 条</span></div>' +
        (recent.length ? recent.map(function (s) {
          var g = Core.byId(st.games.games, s.gameId);
          return '<div class="timeline-item">' +
            '<span class="time">' + Core.fmtDateShort(s.date) + '</span>' +
            '<div class="grow"><div style="font-size:13px">' + (g ? UI.esc(g.name) : '<span class="muted">已删除的游戏</span>') + '</div>' +
              (s.note ? '<div class="small muted">' + UI.esc(s.note) + '</div>' : '') + '</div>' +
            '<span class="tag">' + Core.fmtDuration(s.minutes) + '</span>' +
            '<button class="icon-btn danger" data-act="del-session" data-id="' + s.id + '">' + UI.icon('trash', 14) + '</button>' +
          '</div>';
        }).join('') : '<div class="small muted">还没有游玩记录</div>') +
      '</div>';

    UI.bind(el, 'click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.dataset.act, id = btn.dataset.id;

      if (act === 'filter') { filter = btn.dataset.key; render(el); }
      else if (act === 'add') gameForm(null);
      else if (act === 'edit') gameForm(Core.byId(Store.get().games.games, id));
      else if (act === 'play') sessionForm(id ? Core.byId(Store.get().games.games, id) : null);
      else if (act === 'del') {
        var g = Core.byId(Store.get().games.games, id);
        UI.confirm({
          title: '删除游戏',
          message: '「' + UI.esc(g ? g.name : '') + '」及其游玩记录会被删除，统计会同步变化。',
          confirmText: '删除', danger: true
        }).then(function (ok) {
          if (!ok) return;
          Store.update(function (s) {
            s.games.games = s.games.games.filter(function (x) { return x.id !== id; });
            s.games.sessions = s.games.sessions.filter(function (x) { return x.gameId !== id; });
          }, 'games-del');
          render(el);
        });
      } else if (act === 'del-session') {
        Store.update(function (s) { s.games.sessions = s.games.sessions.filter(function (x) { return x.id !== id; }); }, 'games-del-session');
        render(el);
      }
    });
  }

  window.Views.games = {
    title: '游戏娱乐',
    sub: '游戏库 + 游玩时长 · 想玩、在玩、通关一目了然',
    render: render
  };
})();

</script>
<script>
/*!
 * views/settings.js — 数据与设置：备份、恢复、偏好、清空
 */
window.Views = window.Views || {};
(function () {
  'use strict';
  var Core = window.Core, Store = window.Store, UI = window.UI;

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }

  function stamp() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, '0'); }
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  function exportBackup() {
    var json = Store.exportJSON();
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'myapp-backup-' + stamp() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    UI.toast('备份文件已开始下载', 'ok');
  }

  function targetForm() {
    var t = Store.get().settings.dietTargets;
    UI.formModal({
      title: '每日饮食目标',
      fields: [
        { key: 'kcal', label: '热量（kcal）', type: 'number', min: 0, step: 50 },
        { key: 'water', label: '饮水（ml）', type: 'number', min: 0, step: 250 },
        { key: 'protein', label: '蛋白质（g）', type: 'number', min: 0, step: 5 },
        { key: 'carbs', label: '碳水（g）', type: 'number', min: 0, step: 5 },
        { key: 'fat', label: '脂肪（g）', type: 'number', min: 0, step: 5 }
      ],
      values: t,
      onSubmit: function (v) {
        Store.update(function (s) {
          s.settings.dietTargets = { kcal: v.kcal, water: v.water, protein: v.protein, carbs: v.carbs, fat: v.fat };
        }, 'settings-target');
        window.App.refresh();
      }
    });
  }

  function render(el) {
    var st = Store.get();
    var json = Store.exportJSON();
    var size = new Blob([json]).size;

    var planItems = Object.keys(st.plans).reduce(function (a, k) { return a + st.plans[k].items.length; }, 0);
    var rows = [
      { name: '今日计划（事项）', count: planItems, extra: Object.keys(st.plans).length + ' 天有记录' },
      { name: '快速备忘', count: st.notes.length, extra: '' },
      { name: '自媒体（内容）', count: st.media.posts.length, extra: '账号 ' + st.media.accounts.length + ' 个' },
      { name: '开发工作（工作项）', count: st.dev.items.length, extra: '项目 ' + st.dev.projects.length + ' 个' },
      { name: '咨询工作（客户）', count: st.consult.clients.length, extra: '咨询记录 ' + st.consult.sessions.length + ' 条' },
      { name: '健身计划（动作）', count: st.fitness.sessions.length, extra: '' },
      { name: '饮食计划（餐次）', count: st.diet.meals.length, extra: Object.keys(st.diet.water).length + ' 天有饮水记录' },
      { name: '游戏娱乐（游戏）', count: st.games.games.length, extra: '游玩记录 ' + st.games.sessions.length + ' 条' }
    ];

    el.innerHTML =
      '<div class="grid g-4">' +
        UI.statCard('数据总量', Core.fmtNum(rows.reduce(function (a, r) { return a + r.count; }, 0)) + ' 条', '8 个模块合计', 'layers') +
        UI.statCard('占用空间', fmtSize(size), '浏览器 localStorage', 'save') +
        UI.statCard('最后保存', '<span style="font-size:15px">' + Core.timeAgo(Store.lastSavedAt()) + '</span>', Store.storageAvailable() ? '本地存储正常' : '本地存储不可用', 'clock') +
        '<div class="kpi" style="display:flex;flex-direction:column;justify-content:center;gap:6px">' +
          '<button class="btn btn-primary" data-act="save">' + UI.icon('save', 15) + ' 立即保存（Ctrl+S）</button>' +
          '<span class="small muted" style="text-align:center">每次修改已自动保存，这里可手动再存一次</span>' +
        '</div>' +
      '</div>' +

      '<div class="grid g-2 mt-16" style="align-items:start">' +
        '<div class="card">' +
          '<div class="card-head"><div class="card-title">' + UI.icon('download') + ' 备份与恢复</div></div>' +
          '<p class="small dim" style="line-height:1.7">数据只存在这台电脑的浏览器里。清理浏览器数据、换电脑或重装系统都会丢，建议每周导出一次备份。</p>' +
          '<div class="row mt-12" style="gap:8px">' +
            '<button class="btn btn-primary" data-act="export">' + UI.icon('download', 15) + ' 导出备份</button>' +
            '<button class="btn" data-act="import">' + UI.icon('upload', 15) + ' 导入备份</button>' +
            '<input type="file" id="importFile" accept=".json,application/json" style="display:none">' +
          '</div>' +
          '<div class="row mt-12" style="gap:8px">' +
            '<button class="btn btn-sm" data-act="sample">' + UI.icon('layers', 14) + ' 载入示例数据</button>' +
            '<span class="small muted">想先看看有数据时的效果？示例会覆盖当前数据</span>' +
          '</div>' +
          '<div class="divider"></div>' +
          '<div class="small muted" style="line-height:1.8">' +
            '· 备份文件名：<code>myapp-backup-' + stamp() + '.json</code><br>' +
            '· 导入会<b>覆盖</b>当前全部数据，导入前会再确认一次<br>' +
            '· 导入非法文件时，现有数据不会被破坏<br>' +
            '· 当前数据可读体积：' + fmtSize(size) +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-head"><div class="card-title">' + UI.icon('settings') + ' 偏好设置</div></div>' +
          '<div class="field"><label>昵称（首页问候用）</label>' +
            '<div class="row"><input class="input" id="nameInput" value="' + UI.esc(st.settings.name) + '" maxlength="12">' +
            '<button class="btn" data-act="save-name">保存</button></div></div>' +
          '<div class="field mt-12"><label>主题</label>' +
            '<div class="segmented" style="width:100%">' +
              '<button data-act="theme" data-theme="light" class="' + (st.settings.theme === 'light' ? 'active' : '') + '" style="flex:1">浅色</button>' +
              '<button data-act="theme" data-theme="dark" class="' + (st.settings.theme === 'dark' ? 'active' : '') + '" style="flex:1">深色</button>' +
            '</div></div>' +
          '<div class="field mt-12"><label>每周从哪天开始</label>' +
            '<select class="select" id="weekStart">' +
              '<option value="1"' + (st.settings.weekStart === 1 ? ' selected' : '') + '>周一</option>' +
              '<option value="0"' + (st.settings.weekStart === 0 ? ' selected' : '') + '>周日</option>' +
            '</select></div>' +
          '<div class="divider"></div>' +
          '<div class="spread"><div><div class="small dim">每日饮食目标</div>' +
            '<div class="mono" style="font-size:13px">' + st.settings.dietTargets.kcal + ' kcal · 蛋白 ' + st.settings.dietTargets.protein + 'g</div></div>' +
            '<button class="btn btn-sm" data-act="targets">修改</button></div>' +
        '</div>' +
      '</div>' +

      '<div class="card mt-16">' +
        '<div class="card-head"><div class="card-title">' + UI.icon('layers') + ' 各模块数据</div>' +
          '<span class="small muted">全部保存在本机</span></div>' +
        '<div class="table-scroll"><table class="table">' +
          '<thead><tr><th>模块</th><th class="num">条数</th><th>附加信息</th></tr></thead><tbody>' +
          rows.map(function (r) {
            return '<tr><td>' + r.name + '</td><td class="num mono">' + r.count + '</td>' +
              '<td class="small muted">' + (r.extra || '—') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
      '</div>' +

      '<div class="card mt-16" style="border-color:color-mix(in srgb, var(--danger) 35%, var(--border))">' +
        '<div class="card-head"><div class="card-title" style="color:var(--danger)">' + UI.icon('alert') + ' 危险操作</div></div>' +
        '<p class="small dim">清空会删除本机浏览器里的全部数据，且无法恢复。清空前请先导出备份。</p>' +
        '<div class="row mt-12">' +
          '<button class="btn btn-danger" data-act="clear">清空全部数据</button>' +
          '<button class="btn" data-act="export">先导出备份</button>' +
        '</div>' +
      '</div>';

    /* 事件 */
    UI.bind(el, 'click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.dataset.act;

      if (act === 'save') {
        window.App.save();
      } else if (act === 'export') {
        exportBackup();
      } else if (act === 'import') {
        el.querySelector('#importFile').click();
      } else if (act === 'sample') {
        UI.confirm({
          title: '载入示例数据',
          message: '会用一份演示数据<b>覆盖</b>当前全部内容（含今日计划、各模块记录）。<br>只想看看效果的话，之后可以在「危险操作」里清空。',
          confirmText: '载入示例'
        }).then(function (ok) {
          if (!ok) return;
          try {
            Store.importJSON(JSON.stringify(Core.exportPayload(window.Sample.build())));
            document.documentElement.setAttribute('data-theme', Store.get().settings.theme);
            window.App.refresh();
            UI.toast('示例数据已载入', 'ok');
          } catch (err) {
            UI.toast('载入失败：' + err.message, 'err');
          }
        });
      } else if (act === 'save-name') {
        var val = (el.querySelector('#nameInput').value || '').trim() || '我';
        Store.update(function (s) { s.settings.name = val; }, 'settings-name');
        UI.toast('已保存昵称', 'ok', 1400);
        window.App.refresh();
      } else if (act === 'theme') {
        var theme = btn.dataset.theme;
        Store.update(function (s) { s.settings.theme = theme; }, 'settings-theme');
        document.documentElement.setAttribute('data-theme', theme);
        var tb = document.getElementById('btnTheme');
        if (tb) tb.textContent = theme === 'dark' ? '浅色' : '深色';
        render(el);
      } else if (act === 'targets') {
        targetForm();
      } else if (act === 'clear') {
        UI.formModal({
          title: '清空全部数据',
          desc: '此操作不可恢复，请确认已导出备份',
          fields: [
            { key: 'word', label: '请输入「清空」两个字确认', type: 'text', required: true, span: 2, placeholder: '清空' }
          ],
          values: { word: '' },
          submitText: '确认清空',
          onSubmit: function (v) {
            if (v.word !== '清空') {
              UI.toast('输入不正确，操作已取消', 'err');
              return false;
            }
            Store.reset();
            document.documentElement.setAttribute('data-theme', Store.get().settings.theme);
            window.App.refresh();
            UI.toast('已清空全部数据', 'ok');
          }
        });
      }
    });

    el.querySelector('#weekStart').addEventListener('change', function (e) {
      var v = Number(e.target.value);
      Store.update(function (s) { s.settings.weekStart = v; }, 'settings-weekstart');
      UI.toast(v === 1 ? '每周从周一开始' : '每周从周日开始', 'ok', 1400);
      window.App.refresh();
    });

    el.querySelector('#importFile').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var text = String(reader.result || '');
        var checked = Core.validateImport(text);
        if (!checked.ok) {
          UI.toast(checked.error, 'err', 4000);
          e.target.value = '';
          return;
        }
        UI.confirm({
          title: '导入备份',
          message: '将用「' + UI.esc(file.name) + '」里的数据<b>覆盖</b>当前全部数据（含 ' +
            Object.keys(Store.get().plans).length + ' 天计划、' + Store.get().dev.items.length + ' 个工作项等）。继续吗？',
          confirmText: '覆盖并导入',
          danger: true
        }).then(function (ok) {
          if (!ok) { e.target.value = ''; return; }
          try {
            Store.importJSON(text);
            document.documentElement.setAttribute('data-theme', Store.get().settings.theme);
            window.App.refresh();
            UI.toast('导入成功，数据已恢复', 'ok');
          } catch (err) {
            UI.toast('导入失败：' + err.message, 'err', 4000);
          }
          e.target.value = '';
        });
      };
      reader.onerror = function () { UI.toast('读取文件失败', 'err'); };
      reader.readAsText(file);
    });
  }

  window.Views.settings = {
    title: '数据与设置',
    sub: '备份、恢复、偏好都在这里 · 数据只保存在本机浏览器',
    render: render
  };
})();

</script>
<script>
/*!
 * app.js — 应用外壳：导航、路由、主题、保存入口
 */
(function () {
  'use strict';
  var Core = window.Core, Store = window.Store, UI = window.UI;

  var NAV = [
    { key: 'home', label: '首页总览', icon: 'home' },
    { key: 'plan', label: '今日计划', icon: 'checkSquare' },
    { key: 'media', label: '自媒体', icon: 'video' },
    { key: 'dev', label: '开发工作', icon: 'code' },
    { key: 'consult', label: '咨询工作', icon: 'users' },
    { key: 'fitness', label: '健身计划', icon: 'dumbbell' },
    { key: 'diet', label: '饮食计划', icon: 'utensils' },
    { key: 'games', label: '游戏娱乐', icon: 'gamepad' },
    { key: 'settings', label: '数据与设置', icon: 'settings' }
  ];

  var current = 'home';

  function $(sel) { return document.querySelector(sel); }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function applyTheme() {
    var theme = Store.get().settings.theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    var btn = $('#btnTheme');
    if (btn) btn.textContent = theme === 'dark' ? '浅色' : '深色';
  }

  function buildNav() {
    $('#nav').innerHTML = NAV.map(function (n) {
      return '<a class="nav-item" href="#/' + n.key + '" data-key="' + n.key + '">' +
        UI.icon(n.icon) + '<span>' + n.label + '</span>' +
        '<span class="nav-dot" data-dot="' + n.key + '"></span></a>';
    }).join('');
  }

  function updateBadges() {
    var st = Store.get();
    var today = Core.ymd(new Date());
    var day = st.plans[today];
    var open = day ? day.items.filter(function (i) { return !i.done; }).length : 0;
    var dot = document.querySelector('[data-dot="plan"]');
    if (dot) dot.textContent = open ? String(open) : '';

    var devOpen = st.dev.items.filter(function (i) { return i.status !== 'done'; }).length;
    var devDot = document.querySelector('[data-dot="dev"]');
    if (devDot) devDot.textContent = devOpen ? String(devOpen) : '';
  }

  function renderSaveState(evt) {
    var el = $('#saveState');
    if (!el) return;
    var ok = !evt || evt.ok !== false;
    el.classList.toggle('is-error', !ok);
    var label = el.querySelector('span');
    if (label) {
      label.textContent = ok ? '已保存 ' + fmtTime(Store.lastSavedAt()) : '保存失败！请到设置页导出备份';
    }
    var foot = $('#footSaved');
    if (foot) foot.textContent = '最后保存 ' + fmtTime(Store.lastSavedAt());
  }

  function render() {
    var view = window.Views[current] || window.Views.home;
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-key') === current);
    });

    $('#pageTitle').textContent = view.title;
    $('#pageSub').textContent = typeof view.sub === 'function' ? view.sub() : (view.sub || '');

    var host = $('#view');
    host.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'view-body';
    host.appendChild(el);

    try {
      view.render(el);
    } catch (e) {
      console.error('[myapp] 视图渲染失败：', e);
      el.innerHTML = '<div class="empty"><div class="ico">' + UI.icon('alert') + '</div><b>页面渲染出错了</b><p>' + UI.esc(e.message) + '</p></div>';
    }
    updateBadges();
  }

  function route() {
    var key = (location.hash || '').replace(/^#\/?/, '').trim();
    if (!window.Views[key]) key = 'home';
    current = key;
    render();
  }

  function go(key) {
    if (location.hash === '#/' + key) { current = key; render(); }
    else location.hash = '#/' + key;
  }

  function manualSave() {
    var ok = Store.save('manual');
    renderSaveState({ ok: ok });
    if (ok) UI.toast('已保存到本机浏览器', 'ok');
    else UI.toast('保存失败：' + (Store.lastError() ? Store.lastError().message : '浏览器拒绝写入'), 'err');
  }

  function init() {
    Store.load();
    buildNav();
    applyTheme();
    renderSaveState(null);
    window.addEventListener('hashchange', route);

    $('#btnSave').addEventListener('click', manualSave);

    $('#btnTheme').addEventListener('click', function () {
      var next = Store.get().settings.theme === 'dark' ? 'light' : 'dark';
      Store.update(function (s) { s.settings.theme = next; }, 'theme');
      applyTheme();
      UI.toast(next === 'dark' ? '已切换到深色主题' : '已切换到浅色主题', 'ok', 1400);
    });

    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        manualSave();
      }
    });

    Store.subscribe(function (evt) {
      if (evt.type === 'save' || evt.type === 'import' || evt.type === 'reset') {
        renderSaveState(evt);
        updateBadges();
      }
    });

    if (!Store.storageAvailable()) {
      UI.toast('浏览器禁止本地存储，数据无法保存。请换用 Chrome/Edge 打开，或到设置页导出备份。', 'err', 6000);
      var el = $('#saveState');
      if (el) { el.classList.add('is-error'); el.querySelector('span').textContent = '本地存储不可用'; }
    }

    route();
  }

  window.App = {
    refresh: render,
    go: go,
    current: function () { return current; },
    save: manualSave
  };

  init();
})();

</script>
</body>
</html>

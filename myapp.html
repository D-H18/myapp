<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的生活工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bd6'/%3E%3Cpath d='M9 17l4 4 10-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   myapp 设计系统
   浅色/深色双主题 · 卡片化布局 · 单文件样式
   ============================================================ */

:root {
  --bg: #f5f6fb;
  --bg-image: radial-gradient(1200px 600px at 8% -10%, #e8e9ff 0%, transparent 55%),
              radial-gradient(900px 500px at 100% 0%, #e6f6ff 0%, transparent 50%);
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --surface-3: #eef0f7;
  --border: #e7e9f2;
  --border-strong: #d8dbe8;
  --text: #171a2b;
  --text-dim: #5d6478;
  --text-mute: #98a0b3;
  --brand: #5b5bd6;
  --brand-2: #8b5cf6;
  --brand-ink: #ffffff;
  --brand-soft: #eef0ff;
  --ok: #10b981;
  --warn: #f59e0b;
  --danger: #e5484d;
  --info: #0ea5e9;
  --radius-lg: 18px;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-xs: 0 1px 2px rgba(23, 26, 43, .05);
  --shadow-sm: 0 2px 8px -4px rgba(23, 26, 43, .12);
  --shadow: 0 14px 34px -20px rgba(23, 26, 43, .28);
  --sidebar-w: 236px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Source Han Sans SC", sans-serif;
}

[data-theme="dark"] {
  --bg: #0e1017;
  --bg-image: radial-gradient(1100px 560px at 6% -12%, #1c1f3a 0%, transparent 55%),
              radial-gradient(800px 460px at 100% 0%, #10222e 0%, transparent 50%);
  --surface: #161922;
  --surface-2: #1c2029;
  --surface-3: #232833;
  --border: #262b37;
  --border-strong: #333a49;
  --text: #eef1f8;
  --text-dim: #a3abbf;
  --text-mute: #6f7789;
  --brand: #7c7cf0;
  --brand-2: #a78bfa;
  --brand-soft: #232544;
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-sm: 0 2px 10px -4px rgba(0, 0, 0, .55);
  --shadow: 0 18px 40px -24px rgba(0, 0, 0, .8);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  background-image: var(--bg-image);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------- 布局 ---------------- */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 18px 14px 14px;
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter: blur(14px);
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 14px;
}

.brand-mark {
  width: 34px; height: 34px;
  flex: none;
  border-radius: 11px;
  background: linear-gradient(140deg, var(--brand), var(--brand-2));
  color: #fff;
  display: grid; place-items: center;
  font-weight: 800; font-size: 15px;
  box-shadow: 0 6px 16px -8px var(--brand);
}

.brand-text b { display: block; font-size: 14.5px; letter-spacing: -.01em; }
.brand-text span { font-size: 11px; color: var(--text-mute); }

.nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border-radius: 11px;
  color: var(--text-dim);
  font-size: 13.5px;
  font-weight: 500;
  border: 1px solid transparent;
  transition: background .16s, color .16s, transform .16s;
  position: relative;
}
.nav-item svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active {
  color: var(--brand-ink);
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  box-shadow: 0 8px 20px -12px var(--brand);
}
.nav-item.active svg { opacity: 1; }
.nav-item .nav-dot {
  margin-left: auto;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  background: var(--surface-3);
  color: var(--text-dim);
  border-radius: 99px;
  padding: 0 6px;
  min-width: 20px;
  text-align: center;
}
.nav-item.active .nav-dot { background: rgba(255,255,255,.22); color: #fff; }

.sidebar-foot {
  border-top: 1px solid var(--border);
  padding: 10px 8px 0;
  font-size: 11px;
  color: var(--text-mute);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.sidebar-foot b { color: var(--text-dim); font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 26px 14px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
}

.topbar h1 { font-size: 20px; }
.topbar .sub { font-size: 12.5px; color: var(--text-mute); margin-top: 2px; }

.topbar-actions { display: flex; align-items: center; gap: 10px; }

.save-state {
  font-size: 12px;
  color: var(--text-mute);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.save-state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
.save-state.is-error { color: var(--danger); }
.save-state.is-error .dot { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent); }

.view { padding: 22px 26px 56px; max-width: 1500px; width: 100%; }

/* ---------------- 通用组件 ---------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-xs);
}
.card.tight { padding: 14px; }
.card.flat { box-shadow: none; }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.card-title { font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card-title svg { width: 16px; height: 16px; color: var(--brand); }
.card-sub { font-size: 12px; color: var(--text-mute); }
.card-actions { display: flex; align-items: center; gap: 6px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 13px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 550;
  white-space: nowrap;
  transition: transform .12s, box-shadow .16s, background .16s, border-color .16s;
}
.btn svg { width: 15px; height: 15px; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 8px 18px -12px var(--brand);
}
.btn-primary:hover { color: #fff; filter: brightness(1.05); border-color: transparent; }
.btn-soft { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
.btn-soft:hover { border-color: transparent; filter: brightness(.98); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
.btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: var(--danger); color: var(--danger); }
.btn-sm { height: 28px; padding: 0 9px; font-size: 12px; border-radius: 8px; }
.btn-sm svg { width: 13px; height: 13px; }
.btn-lg { height: 40px; padding: 0 18px; font-size: 14px; border-radius: 11px; }
.btn:disabled { opacity: .5; pointer-events: none; }

.icon-btn {
  width: 28px; height: 28px;
  display: inline-grid; place-items: center;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-mute);
  transition: background .15s, color .15s;
}
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

.input, .select, .textarea {
  width: 100%;
  height: 36px;
  padding: 0 11px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { height: auto; min-height: 76px; padding: 9px 11px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}
.input::placeholder, .textarea::placeholder { color: var(--text-mute); }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-mute) 50%), linear-gradient(135deg, var(--text-mute) 50%, transparent 50%); background-position: calc(100% - 16px) 15px, calc(100% - 11px) 15px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 12px; color: var(--text-dim); font-weight: 550; }
.field .hint { font-size: 11px; color: var(--text-mute); }
.field.span-2 { grid-column: span 2; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 7px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 550;
  background: var(--surface-3);
  color: var(--text-dim);
  white-space: nowrap;
}
.tag.brand { background: var(--brand-soft); color: var(--brand); }
.tag.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: #b45309; }
.tag.danger { background: color-mix(in srgb, var(--danger) 13%, transparent); color: var(--danger); }
.tag.info { background: color-mix(in srgb, var(--info) 14%, transparent); color: var(--info); }
[data-theme="dark"] .tag.warn { color: var(--warn); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--text-dim);
  white-space: nowrap;
}
.chip.active { background: var(--brand-soft); border-color: transparent; color: var(--brand); font-weight: 600; }
.chip:hover { border-color: var(--brand); color: var(--brand); }

.segmented {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 11px;
}
.segmented button {
  height: 28px;
  padding: 0 12px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--text-dim);
  font-weight: 550;
}
.segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-xs); }

.progress { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width .3s; }
.progress.ok > i { background: linear-gradient(90deg, #34d399, #10b981); }
.progress.warn > i { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
.progress.danger > i { background: linear-gradient(90deg, #fb7185, #e5484d); }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-home { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: start; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.muted { color: var(--text-mute); }
.dim { color: var(--text-dim); }
.small { font-size: 12px; }
.mono { font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* ---------------- 数据卡 ---------------- */

.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 14px;
  box-shadow: var(--shadow-xs);
}
.kpi .label { font-size: 11.5px; color: var(--text-mute); display: flex; align-items: center; gap: 5px; }
.kpi .value { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 12px; font-weight: 500; color: var(--text-mute); margin-left: 3px; }
.kpi .foot { font-size: 11.5px; color: var(--text-mute); margin-top: 2px; }

/* ---------------- 今日计划 ---------------- */

.plan-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 8px;
  border-radius: 10px;
  border: 1px solid transparent;
  transition: background .14s, border-color .14s;
}
.plan-item:hover { background: var(--surface-2); }
.plan-item + .plan-item { margin-top: 2px; }
.plan-item.done .plan-title { text-decoration: line-through; color: var(--text-mute); }

.check {
  flex: none;
  width: 18px; height: 18px;
  margin-top: 1px;
  border-radius: 6px;
  border: 1.5px solid var(--border-strong);
  background: var(--surface);
  display: grid; place-items: center;
  color: transparent;
  transition: all .15s;
}
.check svg { width: 12px; height: 12px; stroke-width: 3; }
.check:hover { border-color: var(--brand); }
.check.on { background: linear-gradient(135deg, var(--brand), var(--brand-2)); border-color: transparent; color: #fff; }

.plan-title { font-size: 13.5px; line-height: 1.5; word-break: break-word; }
.plan-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }

.prio { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-top: 7px; }
.prio.high { background: var(--danger); }
.prio.mid { background: var(--warn); }
.prio.low { background: var(--border-strong); }

.quick-add { display: flex; gap: 8px; }
.quick-add .input { height: 38px; }

/* ---------------- 看板 ---------------- */

.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.kanban.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kcol {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  min-height: 232px;
  display: flex;
  flex-direction: column;
}
.kcol > .kcard-new { margin-top: 0; }
.kcol-empty {
  flex: 1;
  display: grid;
  place-items: center;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--text-mute);
  font-size: 12px;
  padding: 16px 8px;
  text-align: center;
  min-height: 72px;
}
.kcol-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; }
.kcol-head b { font-size: 12.5px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.kcol-head .count { font-size: 11px; color: var(--text-mute); background: var(--surface-3); border-radius: 99px; padding: 0 6px; }
.kcol.drag-over { border-color: var(--brand); background: var(--brand-soft); }

.kcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 10px 11px;
  box-shadow: var(--shadow-xs);
  transition: box-shadow .16s, transform .16s;
}
.kcard + .kcard { margin-top: 8px; }
.kcard:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.kcard .title { font-size: 13px; font-weight: 550; line-height: 1.45; word-break: break-word; }
.kcard .meta { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.kcard .ops { display: flex; align-items: center; gap: 1px; margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--border); }
.kcard .ops .spacer { flex: 1; }
.kcard-new { width: 100%; height: 30px; border: 1px dashed var(--border-strong); border-radius: 9px; background: transparent; color: var(--text-mute); font-size: 12px; }
.kcard-new:hover { border-color: var(--brand); color: var(--brand); }

.stripe { width: 3px; align-self: stretch; border-radius: 99px; background: var(--brand); flex: none; }

/* ---------------- 表格 ---------------- */

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-mute);
  padding: 0 10px 8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--surface-2); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }

/* ---------------- 月历 ---------------- */

.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.cal-title { font-size: 15px; font-weight: 650; }
.cal-week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
  margin-bottom: 6px;
}
.cal-week span { text-align: center; font-size: 11.5px; color: var(--text-mute); font-weight: 550; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-cell {
  min-height: 68px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface);
  padding: 6px 7px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  transition: border-color .15s, box-shadow .15s, transform .15s;
  position: relative;
  overflow: hidden;
}
.cal-cell:hover { border-color: var(--brand); box-shadow: var(--shadow-xs); }
.cal-cell.out { opacity: .42; }
.cal-cell.today { border-color: var(--brand); }
.cal-cell.today .d { background: var(--brand); color: #fff; }
.cal-cell.sel { border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 25%, transparent); }
.cal-cell .d { font-size: 11.5px; font-weight: 650; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.cal-cell .chips { display: flex; flex-wrap: wrap; gap: 3px; }
.cal-cell .mini { font-size: 10.5px; color: var(--text-mute); margin-top: auto; }
.cal-cell .cal-empty { color: var(--border-strong); font-size: 16px; line-height: 1; margin: auto; }

.dot-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 1px 5px; border-radius: 5px; background: var(--surface-3); color: var(--text-dim); line-height: 1.5; white-space: nowrap; }

/* ---------------- 图表 ---------------- */

.chart-wrap { width: 100%; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 11.5px; color: var(--text-dim); }

.bars-h { display: flex; flex-direction: column; gap: 9px; }

.bars-h .bh-track { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bars-h .bh-fill { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); min-width: 3px; }

.bars-h.stacked { gap: 12px; }
.bars-h.stacked .bh-item { display: flex; flex-direction: column; gap: 5px; }
.bars-h.stacked .bh-label { width: auto; max-width: 100%; color: var(--text); font-size: 12.5px; }
.bars-h.stacked .bh-track { height: 7px; }
.bars-h.stacked .bh-val { font-size: 12px; }

.bars-v { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
.bars-v .bv { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bars-v .bv-track { width: 100%; max-width: 34px; flex: 1; display: flex; align-items: flex-end; }
.bars-v .bv-fill { width: 100%; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--brand-2), var(--brand)); min-height: 3px; transition: height .3s; }
.bars-v .bv-label { font-size: 10.5px; color: var(--text-mute); white-space: nowrap; }

.ring-wrap { position: relative; display: inline-grid; place-items: center; }
.ring-wrap .ring-text { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring-wrap .ring-text b { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.ring-wrap .ring-text span { display: block; font-size: 10.5px; color: var(--text-mute); }

/* ---------------- 空状态 ---------------- */

.empty {
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 22px 16px;
  text-align: center;
  color: var(--text-mute);
  background: color-mix(in srgb, var(--surface-2) 60%, transparent);
}
.empty .ico {
  width: 34px; height: 34px;
  margin: 0 auto 8px;
  border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface-3);
  color: var(--text-mute);
}
.empty .ico svg { width: 17px; height: 17px; }
.empty b { display: block; color: var(--text-dim); font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.empty p { font-size: 12px; }

/* ---------------- 弹窗 ---------------- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(12, 14, 24, .42);
  backdrop-filter: blur(3px);
  display: grid;
  place-items: center;
  padding: 24px;
  z-index: 100;
  animation: fade .16s ease;
}
[data-theme="dark"] .modal-backdrop { background: rgba(0, 0, 0, .6); }

.modal {
  width: min(560px, 100%);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 30px 70px -30px rgba(10, 12, 25, .55);

}
.modal.wide { width: min(760px, 100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 18px 8px; }
.modal-head h3 { font-size: 15.5px; }

.modal-body { padding: 10px 18px 4px; overflow-y: auto; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 18px 16px; }
.modal-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }

/* ---------------- Toast ---------------- */

.toast-wrap { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast {
  display: flex; align-items: center; gap: 8px;
  background: var(--text);
  color: var(--surface);
  border-radius: 11px;
  padding: 9px 14px;
  font-size: 13px;
  box-shadow: var(--shadow);
  animation: slide-in .2s ease;
}
.toast.ok { background: #0f9d76; color: #fff; }
.toast.err { background: #d93a3f; color: #fff; }
.toast svg { width: 15px; height: 15px; }
@keyframes slide-in { from { opacity: 0; transform: translateY(8px); } }

.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-lg);
  padding: 20px 22px;

.hero h2 { font-size: 21px; letter-spacing: -.02em; }

.hero .hero-stats div span { font-size: 11px; opacity: .78; }

.summary-card { display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: transform .16s, box-shadow .16s, border-color .16s; }
.summary-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--border-strong); }
.summary-card .top { display: flex; align-items: center; gap: 8px; }

.summary-card .name { font-size: 13px; font-weight: 600; }

.summary-card .nums small { font-size: 11.5px; color: var(--text-mute); }
.summary-card .line {

}

.summary-card .nums b, .summary-card .nums small { white-space: nowrap; }

.note-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 6px; border-radius: 9px; }

.note-item .txt { font-size: 13px; line-height: 1.5; word-break: break-word; }

.day-strip { display: flex; align-items: center; gap: 6px; }

  padding: 7px 4px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 11.5px;
  color: var(--text-dim);
  transition: all .15s;
}

.day-strip .day:hover { border-color: var(--brand); }
.day-strip .day.active { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -12px var(--brand); }
.day-strip .day .pip { width: 4px; height: 4px; border-radius: 50%; background: var(--warn); opacity: 0; }
.day-strip .day.has .pip { opacity: 1; }
.day-strip .day.active .pip { background: #fff; }

.timeline-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
.timeline-item:last-child { border-bottom: 0; }
.timeline-item .time { font-size: 11.5px; color: var(--text-mute); width: 42px; flex: none; padding-top: 1px; font-variant-numeric: tabular-nums; }

.stars { display: inline-flex; gap: 1px; color: var(--warn); font-size: 11px; letter-spacing: .5px; }

.gcard { display: flex; flex-direction: column; gap: 8px; }
.gcard .cover {
  height: 74px; border-radius: 11px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #fff), color-mix(in srgb, var(--accent) 52%, #000));

.kv { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px 10px; font-size: 12.5px; }

.hint-box {
  display: flex; gap: 9px;
  padding: 11px 13px;
  border-radius: 11px;
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 12.5px;
  line-height: 1.6;
}
.hint-box svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }

.target-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

@media (max-width: 1180px) {

}

  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px; gap: 6px; }

  .kanban, .kanban.cols-5 { grid-template-columns: 1fr; }
}

@media print {
  .sidebar, .topbar-actions, .toast-wrap { display: none; }
}

      source: (v.source && typeof v.source === 'object' && v.source.module)
        ? { module: str(v.source.module), refId: str(v.source.refId) }
        : null,
      createdAt: str(v.createdAt) || nowISO()
    };
  }

  function normalizePlans(raw) {
    var out = {};
    if (!raw || typeof raw !== 'object') return out;
    Object.keys(raw).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      var day = raw[k] || {};
      var items = arr(day.items).map(normalizePlanItem).filter(Boolean);
      out[k] = { items: items, review: str(day.review) };
    });
    return out;
  }

  function normalizeData(input) {
    var d = defaultData();
    if (!input || typeof input !== 'object') return d;

    var s = input.settings || {};
    var t = s.dietTargets || {};
    d.settings = {
      name: str(s.name, '我') || '我',
      theme: s.theme === 'dark' ? 'dark' : 'light',
      weekStart: s.weekStart === 0 ? 0 : 1,
      dietTargets: {
        kcal: num(t.kcal, 2000),
        protein: num(t.protein, 120),
        carbs: num(t.carbs, 230),
        fat: num(t.fat, 65),
        water: num(t.water, 2000)
      }
    };

    var meta = input.meta || {};
    d.meta = {
      createdAt: str(meta.createdAt) || d.meta.createdAt,
      updatedAt: str(meta.updatedAt) || d.meta.updatedAt
    };

    d.notes = arr(input.notes).map(normalizeNote).filter(Boolean);
    d.plans = normalizePlans(input.plans);

    /* 自媒体 */
    var media = input.media || {};
    d.media.accounts = arr(media.accounts).map(function (a) {
      if (!a || typeof a !== 'object' || !str(a.name).trim()) return null;
      return {
        id: str(a.id) || uid('acc'),
        platform: str(a.platform) || '其他',
        name: str(a.name).trim()
      };
    }).filter(Boolean);
    d.media.posts = arr(media.posts).map(function (p) {
      if (!p || typeof p !== 'object') return null;
      var title = str(p.title).trim();
      if (!title) return null;
      var stage = ['idea', 'script', 'shoot', 'edit', 'published'].indexOf(p.stage) >= 0 ? p.stage : 'idea';
      return {
        id: str(p.id) || uid('post'),
        title: title,
        platform: str(p.platform) || '其他',
        stage: p.publishDate ? 'published' : stage,
        publishDate: str(p.publishDate),
        views: num(p.views),
        likes: num(p.likes),
        comments: num(p.comments),
        shares: num(p.shares),
        saves: num(p.saves),
        followers: num(p.followers),
        url: str(p.url),
        note: str(p.note),
        createdAt: str(p.createdAt) || nowISO()
      };
    }).filter(Boolean);

    /* 开发 */
    var dev = input.dev || {};
    d.dev.projects = arr(dev.projects).map(function (p) {
      if (!p || typeof p !== 'object' || !str(p.name).trim()) return null;
      return { id: str(p.id) || uid('proj'), name: str(p.name).trim(), color: str(p.color) || '#6366f1', note: str(p.note) };
    }).filter(Boolean);
    d.dev.items = arr(dev.items).map(function (it) {
      if (!it || typeof it !== 'object') return null;
      var title = str(it.title).trim();
      if (!title) return null;
      return {
        id: str(it.id) || uid('task'),
        title: title,
        projectId: str(it.projectId),
        type: ['feature', 'bug', 'task', 'debt'].indexOf(it.type) >= 0 ? it.type : 'task',
        status: ['todo', 'doing', 'review', 'done'].indexOf(it.status) >= 0 ? it.status : 'todo',
        priority: ['high', 'mid', 'low'].indexOf(it.priority) >= 0 ? it.priority : 'mid',
        estimate: num(it.estimate),
        due: str(it.due),
        doneAt: str(it.doneAt),
        note: str(it.note),
        createdAt: str(it.createdAt) || nowISO()
      };
    }).filter(Boolean);

    /* 咨询 */
    var consult = input.consult || {};
    d.consult.clients = arr(consult.clients).map(function (c) {
      if (!c || typeof c !== 'object' || !str(c.name).trim()) return null;
      var stage = ['lead', 'talking', 'signed', 'delivering', 'done', 'lost'].indexOf(c.stage) >= 0 ? c.stage : 'lead';
      return {
        id: str(c.id) || uid('client'),
        name: str(c.name).trim(),
        company: str(c.company),
        contact: str(c.contact),
        stage: stage,
        tags: str(c.tags),
        note: str(c.note),
        createdAt: str(c.createdAt) || nowISO()
      };
    }).filter(Boolean);
    d.consult.sessions = arr(consult.sessions).map(function (x) {
      if (!x || typeof x !== 'object') return null;
      var date = str(x.date);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
      return {
        id: str(x.id) || uid('session'),
        clientId: str(x.clientId),
        date: date,
        minutes: num(x.minutes, 60),
        topic: str(x.topic),
        fee: num(x.fee),
        note: str(x.note)
      };
    }).filter(Boolean);

    /* 健身 */
    var fitness = input.fitness || {};
    d.fitness.sessions = arr(fitness.sessions).map(function (f) {
      if (!f || typeof f !== 'object') return null;
      var date = str(f.date);
      var exercise = str(f.exercise).trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !exercise) return null;
      return {
        id: str(f.id) || uid('fit'),
        date: date,
        part: ['chest', 'back', 'legs', 'shoulders', 'arms', 'core', 'cardio'].indexOf(f.part) >= 0 ? f.part : 'chest',
        exercise: exercise,
        sets: num(f.sets, 3),
        reps: num(f.reps, 10),
        weight: num(f.weight),
        note: str(f.note),
        createdAt: str(f.createdAt) || nowISO()
      };
    }).filter(Boolean);

    /* 饮食 */
    var diet = input.diet || {};
    d.diet.meals = arr(diet.meals).map(function (m) {
      if (!m || typeof m !== 'object') return null;
      var date = str(m.date);
      var name = str(m.name).trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !name) return null;
      return {
        id: str(m.id) || uid('meal'),
        date: date,
        type: ['breakfast', 'lunch', 'dinner', 'snack'].indexOf(m.type) >= 0 ? m.type : 'lunch',
        name: name,
        kcal: num(m.kcal),
        protein: num(m.protein),
        carbs: num(m.carbs),
        fat: num(m.fat),
        note: str(m.note)
      };
    }).filter(Boolean);
    d.diet.water = {};
    if (diet.water && typeof diet.water === 'object') {
      Object.keys(diet.water).forEach(function (k) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k)) d.diet.water[k] = num(diet.water[k]);
      });
    }

    /* 游戏 */
    var games = input.games || {};
    d.games.games = arr(games.games).map(function (g) {
      if (!g || typeof g !== 'object' || !str(g.name).trim()) return null;
      return {
        id: str(g.id) || uid('game'),
        name: str(g.name).trim(),
        platform: str(g.platform) || 'PC',
        status: ['wish', 'playing', 'done', 'paused'].indexOf(g.status) >= 0 ? g.status : 'wish',
        rating: clamp(num(g.rating), 0, 10),
        hours: num(g.hours),
        note: str(g.note),
        createdAt: str(g.createdAt) || nowISO()
      };
    }).filter(Boolean);
    d.games.sessions = arr(games.sessions).map(function (x) {
      if (!x || typeof x !== 'object') return null;
      var date = str(x.date);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
      return {
        id: str(x.id) || uid('gsess'),
        gameId: str(x.gameId),
        date: date,
        minutes: num(x.minutes, 30),
        note: str(x.note)
      };
    }).filter(Boolean);

    return d;
  }

  /* ---------------- 统计口径 ---------------- */

  /** 今日计划 */
  function planStats(day) {
    var items = arr(day && day.items);
    var done = items.filter(function (i) { return i.done; }).length;
    return {
      total: items.length,
      done: done,
      open: items.length - done,
      rate: items.length ? Math.round((done / items.length) * 100) : 0,
      highOpen: items.filter(function (i) { return !i.done && i.priority === 'high'; }).length
    };
  }

  /** 自媒体：发布数据复盘 */
  function mediaStats(posts, opts) {
    opts = opts || {};
    var today = opts.today || ymd(new Date());
    var days = num(opts.days, 30);
    var start = opts.from || addDays(today, -(days - 1));
    var end = opts.to || today;
    var all = arr(posts);
    var published = all.filter(function (p) { return p.publishDate; });
    var scoped = published.filter(function (p) { return p.publishDate >= start && p.publishDate <= end; });

    var views = sum(scoped, function (p) { return p.views; });
    var likes = sum(scoped, function (p) { return p.likes; });
    var comments = sum(scoped, function (p) { return p.comments; });
    var shares = sum(scoped, function (p) { return p.shares; });
    var saves = sum(scoped, function (p) { return p.saves; });
    var followers = sum(scoped, function (p) { return p.followers; });

    var platformMap = {};
    scoped.forEach(function (p) {
      var key = p.platform || '其他';
      if (!platformMap[key]) platformMap[key] = { platform: key, count: 0, views: 0 };
      platformMap[key].count += 1;
      platformMap[key].views += num(p.views);
    });

    var series = scoped.slice()
      .sort(function (a, b) { return a.publishDate < b.publishDate ? -1 : a.publishDate > b.publishDate ? 1 : 0; })
      .map(function (p) {
        return { date: p.publishDate, label: fmtDateShort(p.publishDate), value: num(p.views), title: p.title };
      });

    var top = scoped.slice()
      .sort(function (a, b) { return num(b.views) - num(a.views); })
      .slice(0, 5)
      .map(function (p) { return { title: p.title, platform: p.platform, value: num(p.views) }; });

    var byPlatform = Object.keys(platformMap).map(function (k) { return platformMap[k]; })
      .sort(function (a, b) { return b.views - a.views; });

    var byStage = { idea: 0, script: 0, shoot: 0, edit: 0, published: 0 };
    all.forEach(function (p) { if (byStage[p.stage] !== undefined) byStage[p.stage] += 1; });

    return {
      from: start,
      to: end,
      totalPublished: published.length,
      count: scoped.length,
      views: views,
      likes: likes,
      comments: comments,
      shares: shares,
      saves: saves,
      followers: followers,
      engagement: views ? round1(((likes + comments + shares + saves) / views) * 100) : 0,
      series: series,
      top: top,
      byPlatform: byPlatform,
      byStage: byStage,
      avgViews: scoped.length ? Math.round(views / scoped.length) : 0
    };
  }

  /** 开发工作 */
  function devStats(items, opts) {
    opts = opts || {};
    var today = opts.today || ymd(new Date());
    var list = arr(items);
    var weekStart = startOfWeek(today, opts.weekStart);
    var st = { todo: 0, doing: 0, review: 0, done: 0 };
    var byType = { feature: 0, bug: 0, task: 0, debt: 0 };
    var overdue = 0, dueSoon = 0, doneThisWeek = 0, estimateOpen = 0;

    list.forEach(function (it) {
      if (st[it.status] !== undefined) st[it.status] += 1;
      if (byType[it.type] !== undefined) byType[it.type] += 1;
      if (it.status !== 'done') {
        estimateOpen += num(it.estimate);
        if (it.due && it.due < today) overdue += 1;
        else if (it.due && it.due <= addDays(today, 3)) dueSoon += 1;
      } else if (it.doneAt && it.doneAt.slice(0, 10) >= weekStart) {
        doneThisWeek += 1;
      }
    });

    return {
      total: list.length,
      todo: st.todo,
      doing: st.doing,
      review: st.review,
      done: st.done,
      open: st.todo + st.doing + st.review,
      overdue: overdue,
      dueSoon: dueSoon,
      doneThisWeek: doneThisWeek,
      estimateOpen: round1(estimateOpen),
      byType: byType,
      rate: list.length ? Math.round((st.done / list.length) * 100) : 0
    };
  }

  /** 咨询工作 */
  function consultStats(clients, sessions, opts) {
    opts = opts || {};
    var today = opts.today || ymd(new Date());
    var month = opts.month || monthOf(today);
    var cl = arr(clients);
    var ss = arr(sessions);
    var byStage = { lead: 0, talking: 0, signed: 0, delivering: 0, done: 0, lost: 0 };
    cl.forEach(function (c) { if (byStage[c.stage] !== undefined) byStage[c.stage] += 1; });

    var revenue = sum(ss, function (s) { return s.fee; });
    var monthRevenue = sum(ss.filter(function (s) { return monthOf(s.date) === month; }), function (s) { return s.fee; });
    var minutes = sum(ss, function (s) { return s.minutes; });
    var perClient = {};
    ss.forEach(function (s) {
      if (!perClient[s.clientId]) perClient[s.clientId] = { count: 0, minutes: 0, fee: 0, lastDate: '' };
      var e = perClient[s.clientId];
      e.count += 1;
      e.minutes += num(s.minutes);
      e.fee += num(s.fee);
      if (s.date > e.lastDate) e.lastDate = s.date;
    });

    return {
      totalClients: cl.length,
      byStage: byStage,
      active: byStage.talking + byStage.signed + byStage.delivering,
      signed: byStage.signed + byStage.delivering + byStage.done,
      revenue: revenue,
      monthRevenue: monthRevenue,
      minutes: minutes,
      hours: round1(minutes / 60),
      sessionCount: ss.length,
      monthSessions: ss.filter(function (s) { return monthOf(s.date) === month; }).length,
      perClient: perClient,
      avgFee: ss.length ? Math.round(revenue / ss.length) : 0
    };
  }

  /** 健身 */
  function fitnessStats(sessions, opts) {
    opts = opts || {};
    var today = opts.today || ymd(new Date());
    var month = opts.month || monthOf(today);
    var list = arr(sessions);
    var byDate = {};
    var partMap = {};

    list.forEach(function (s) {
      if (!byDate[s.date]) byDate[s.date] = { parts: {}, count: 0, sets: 0, volume: 0 };
      var d = byDate[s.date];
      d.parts[s.part] = (d.parts[s.part] || 0) + num(s.sets);
      d.count += 1;
      d.sets += num(s.sets);
      d.volume += num(s.sets) * num(s.reps) * num(s.weight);

      if (!partMap[s.part]) partMap[s.part] = { part: s.part, sets: 0, count: 0, volume: 0 };
      partMap[s.part].sets += num(s.sets);
      partMap[s.part].count += 1;
      partMap[s.part].volume += num(s.sets) * num(s.reps) * num(s.weight);
    });

    var dates = Object.keys(byDate).sort();
    var monthDates = dates.filter(function (d) { return d.slice(0, 7) === month; });

    /* 连续打卡：今天有就今天算起，否则从昨天算起 */
    var streak = 0;
    var cursor = byDate[today] ? today : addDays(today, -1);
    while (byDate[cursor]) { streak += 1; cursor = addDays(cursor, -1); }

    var week = weekDates(today, opts.weekStart);
    var weekDatesSet = week.filter(function (d) { return byDate[d]; });

    return {
      totalSessions: list.length,
      totalDays: dates.length,
      monthDays: monthDates.length,
      monthSessions: list.filter(function (s) { return s.date.slice(0, 7) === month; }).length,
      monthSets: sum(list.filter(function (s) { return s.date.slice(0, 7) === month; }), function (s) { return s.sets; }),
      weekDays: weekDatesSet.length,
      weekSessions: list.filter(function (s) { return week.indexOf(s.date) >= 0; }).length,
      streak: streak,
      byDate: byDate,
      byPart: Object.keys(partMap).map(function (k) { return partMap[k]; }).sort(function (a, b) { return b.sets - a.sets; }),
      volume: Math.round(sum(list, function (s) { return num(s.sets) * num(s.reps) * num(s.weight); })),
      lastDate: dates.length ? dates[dates.length - 1] : ''
    };
  }

  /** 饮食：单日汇总 */
  function dietDay(meals, date, targets, waterMl) {
    var list = arr(meals).filter(function (m) { return m.date === date; });
    var t = targets || defaultData().settings.dietTargets;
    var out = {
      date: date,
      count: list.length,
      kcal: sum(list, function (m) { return m.kcal; }),
      protein: round1(sum(list, function (m) { return m.protein; })),
      carbs: round1(sum(list, function (m) { return m.carbs; })),
      fat: round1(sum(list, function (m) { return m.fat; })),
      water: num(waterMl),
      byMeal: { breakfast: [], lunch: [], dinner: [], snack: [] },
      targets: t
    };
    list.forEach(function (m) {
      (out.byMeal[m.type] || out.byMeal.snack).push(m);
    });
    out.kcalTarget = num(t.kcal);
    out.remaining = out.kcalTarget - out.kcal;
    out.pct = out.kcalTarget ? Math.round(Math.min(1, out.kcal / out.kcalTarget) * 100) : 0;
    out.proteinPct = num(t.protein) ? Math.round((out.protein / t.protein) * 100) : 0;
    out.carbsPct = num(t.carbs) ? Math.round((out.carbs / t.carbs) * 100) : 0;
    out.fatPct = num(t.fat) ? Math.round((out.fat / t.fat) * 100) : 0;
    out.waterPct = num(t.water) ? Math.round((out.water / t.water) * 100) : 0;
    return out;
  }

  /** 饮食：区间日均 */
  function dietRange(meals, dates, targets) {
    var days = arr(dates);
    var total = 0, logged = 0;
    days.forEach(function (d) {
      var k = sum(arr(meals).filter(function (m) { return m.date === d; }), function (m) { return m.kcal; });
      if (k > 0) { logged += 1; total += k; }
    });
    return { days: days.length, loggedDays: logged, totalKcal: total, avgKcal: logged ? Math.round(total / logged) : 0 };
  }

  /** 游戏 */
  function gamesStats(games, sessions, opts) {
    opts = opts || {};
    var today = opts.today || ymd(new Date());
    var list = arr(games);
    var ss = arr(sessions);
    var byStatus = { wish: 0, playing: 0, done: 0, paused: 0 };
    list.forEach(function (g) { if (byStatus[g.status] !== undefined) byStatus[g.status] += 1; });

    var week = weekDates(today, opts.weekStart);
    var totalMinutes = sum(ss, function (s) { return s.minutes; });
    var weekMinutes = sum(ss.filter(function (s) { return week.indexOf(s.date) >= 0; }), function (s) { return s.minutes; });

    var platformMap = {};
    list.forEach(function (g) {
      var k = g.platform || '其他';
      if (!platformMap[k]) platformMap[k] = { platform: k, count: 0, minutes: 0 };
      platformMap[k].count += 1;
      platformMap[k].minutes += sum(ss.filter(function (s) { return s.gameId === g.id; }), function (s) { return s.minutes; });
    });

    var rated = list.filter(function (g) { return num(g.rating) > 0; });

    return {
      total: list.length,
      byStatus: byStatus,
      totalMinutes: totalMinutes,
      totalHours: round1(totalMinutes / 60),
      weekMinutes: weekMinutes,
      weekHours: round1(weekMinutes / 60),
      weekSessions: ss.filter(function (s) { return week.indexOf(s.date) >= 0; }).length,
      avgRating: rated.length ? round1(sum(rated, function (g) { return g.rating; }) / rated.length) : 0,
      byPlatform: Object.keys(platformMap).map(function (k) { return platformMap[k]; }).sort(function (a, b) { return b.minutes - a.minutes; })
    };
  }

  /* ---------------- 备份校验 ---------------- */

  var APP_ID = 'myapp';
  var KNOWN_KEYS = ['settings', 'notes', 'plans', 'media', 'dev', 'consult', 'fitness', 'diet', 'games'];

  function exportPayload(data) {
    return { app: APP_ID, schema: SCHEMA, exportedAt: nowISO(), data: data };
  }

  function validateImport(text) {
    var parsed;
    try {
      parsed = typeof text === 'string' ? JSON.parse(text) : text;
    } catch (e) {
      return { ok: false, error: '文件不是有效的 JSON，无法解析。' };
    }
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
      return { ok: false, error: '文件内容不是 myapp 的备份格式。' };
    }
    if (parsed.app !== APP_ID) {
      return { ok: false, error: '这不是 myapp 的备份文件（缺少 app 标识）。' };
    }
    if (!parsed.data || typeof parsed.data !== 'object') {
      return { ok: false, error: '备份文件里没有 data 数据块。' };
    }
    var hasKnown = KNOWN_KEYS.some(function (k) { return parsed.data[k] !== undefined; });
    if (!hasKnown) {
      return { ok: false, error: '备份内容为空或结构不正确，已取消导入。' };
    }
    return { ok: true, data: normalizeData(parsed.data), schema: parsed.schema || SCHEMA };
  }

  return {
    SCHEMA: SCHEMA, APP_ID: APP_ID, WEEK_CN: WEEK_CN,
    uid: uid, num: num, clamp: clamp, round1: round1, sum: sum, byId: byId, str: str,
    ymd: ymd, toDate: toDate, addDays: addDays, diffDays: diffDays,
    startOfWeek: startOfWeek, weekDates: weekDates, monthOf: monthOf, addMonths: addMonths,
    monthGrid: monthGrid, fmtDateCN: fmtDateCN, fmtDateShort: fmtDateShort, fmtMonthCN: fmtMonthCN, timeAgo: timeAgo,
    fmtNum: fmtNum, fmtMoney: fmtMoney, fmtPct: fmtPct, fmtDuration: fmtDuration,
    defaultData: defaultData, normalizeData: normalizeData,
    planStats: planStats, mediaStats: mediaStats, devStats: devStats, consultStats: consultStats,
    fitnessStats: fitnessStats, dietDay: dietDay, dietRange: dietRange, gamesStats: gamesStats,
    exportPayload: exportPayload, validateImport: validateImport, nowISO: nowISO
  };
});

  function emit(evt) {
    listeners.slice().forEach(function (fn) {
      try { fn(evt); } catch (e) { /* 单个订阅者异常不影响其他人 */ }
    });
  }

  function load() {
    var b = backend();
    var raw = null;
    try { raw = b ? b.getItem(KEY) : null; } catch (e) { raw = null; }

    var parsed = null;
    if (raw) {
      try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    }
    var payload = parsed && parsed.data ? parsed.data : parsed;
    state = Core.normalizeData(payload);
    lastSaved = (parsed && parsed.savedAt) || state.meta.updatedAt || null;
    lastError = null;
    emit({ type: 'load', key: KEY });
    return state;
  }

  function get() {
    if (!state) load();
    return state;
  }

  function serialize() {
    return JSON.stringify({
      app: Core.APP_ID,
      schema: Core.SCHEMA,
      savedAt: state.meta.updatedAt,
      data: state
    });
  }

  function save(reason) {
    if (!state) state = Core.defaultData();
    state.meta.updatedAt = Core.nowISO();
    lastSaved = state.meta.updatedAt;
    var b = backend();
    var ok = true;
    if (!b) {
      ok = false;
      lastError = new Error('当前浏览器不允许写入本地存储');
    } else {
      try {
        b.setItem(KEY, serialize());
        lastError = null;
      } catch (e) {
        ok = false;
        lastError = e;
      }
    }
    emit({ type: 'save', reason: reason || 'auto', ok: ok, error: lastError, at: lastSaved });
    return ok;
  }

  /** 修改并保存：mutator 直接改 state */
  function update(mutator, reason) {
    var s = get();
    var result = mutator ? mutator(s) : undefined;
    save(reason || 'update');
    return result;
  }

  function subscribe(fn) {
    if (typeof fn !== 'function') return function () {};
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function exportJSON() {
    return JSON.stringify(Core.exportPayload(get()), null, 2);
  }

  /** 导入失败时抛错，且不修改现有数据 */
  function importJSON(text) {
    var checked = Core.validateImport(text);
    if (!checked.ok) {
      var err = new Error(checked.error);
      err.code = 'IMPORT_INVALID';
      throw err;
    }
    state = checked.data;
    var ok = save('import');
    if (!ok) throw new Error('导入成功但写入本地存储失败：' + (lastError && lastError.message));
    emit({ type: 'import' });
    return state;
  }

  function reset() {
    state = Core.defaultData();
    save('reset');
    emit({ type: 'reset' });
    return state;
  }

  var API = {
    KEY: KEY,
    load: load,
    get: get,
    save: save,
    update: update,
    subscribe: subscribe,
    exportJSON: exportJSON,
    importJSON: importJSON,
    reset: reset,
    setBackend: setBackend,
    storageAvailable: storageAvailable,
    lastSavedAt: function () { return lastSaved; },
    lastError: function () { return lastError; }
  };

  return API;
});

  function formModal(cfg) {

      fields.map(function (f) { return fieldHTML(f, values[f.key]); }).join('') + '</form>';

      var out = {};
      for (var i = 0; i < fields.length; i++) {
        var f = fields[i];

        var input = form.elements[f.key];
        if (!input) continue;
        if (f.type === 'checkbox') { out[f.key] = input.checked; continue; }
        var raw = input.value;
        if (f.type === 'number') {
          var n = parseFloat(raw);
          out[f.key] = isNaN(n) ? 0 : n;
          if (f.required && (raw === '' || isNaN(n))) return { error: '请填写「' + f.label + '」' };
        } else {
          out[f.key] = String(raw).trim();

      var res = collect();

      if (cfg.onSubmit) {

  /* ---------------- 图表 ---------------- */

  var chartSeq = 0;

  function niceStep(v) {
    var n = Math.max(v, 1);
    var mag = Math.pow(10, Math.floor(Math.log(n) / Math.LN10));
    var norm = n / mag;
    var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    return step * mag;
  }

  /** 折线图：series = [{label, value, date?}] */
  function chartLine(series, opts) {
    opts = opts || {};
    var data = (series || []).slice();
    if (!data.length) {
      return '<div class="empty"><div class="ico">' + icon('chart') + '</div><b>还没有可绘制的数据</b><p>' +
        esc(opts.emptyHint || '添加数据后这里会自动生成图表') + '</p></div>';
    }
    var W = 680, H = 236, padL = 50, padR = 16, padT = 16, padB = 34;
    var rawMax = Math.max.apply(null, data.map(function (d) { return d.value; }).concat([1]));
    var step = niceStep(rawMax / 4);
    var max = Math.ceil(rawMax / step) * step;
    var ticks = Math.max(1, Math.round(max / step));
    var n = data.length;
    var iw = W - padL - padR;
    var ih = H - padT - padB;
    var x = function (i) { return padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw); };
    var y = function (v) { return padT + ih - (v / max) * ih; };
    var uid = 'ln' + (++chartSeq);

    var grid = '';
    for (var g = 0; g <= ticks; g++) {
      var gy = padT + (ih / ticks) * g;
      var gv = max - step * g;
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 5"/>';
      grid += '<text x="' + (padL - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10.5" fill="var(--text-mute)">' + Core.fmtNum(gv) + '</text>';
    }

    var line = '', area = '';
    data.forEach(function (d, i) {
      line += (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(d.value).toFixed(1) + ' ';
    });
    area = 'M' + x(0).toFixed(1) + ' ' + (padT + ih) + ' ' +
      data.map(function (d, i) { return 'L' + x(i).toFixed(1) + ' ' + y(d.value).toFixed(1); }).join(' ') +
      ' L' + x(n - 1).toFixed(1) + ' ' + (padT + ih) + ' Z';

    var dots = '';
    var step = Math.ceil(n / 7);
    data.forEach(function (d, i) {
      dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(d.value).toFixed(1) + '" r="3.2" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"/>';
      if (i % step === 0 || i === n - 1) {
        dots += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10" fill="var(--text-mute)">' + esc(d.label) + '</text>';
      }
      dots += '<title>' + esc((d.title ? d.title + ' · ' : '') + (d.date || d.label) + '：' + Core.fmtNum(d.value)) + '</title>';
    });

    return '<div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
      '<defs><linearGradient id="' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--brand)" stop-opacity=".26"/>' +
      '<stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>' +
      grid +
      '<path d="' + area + '" fill="url(#' + uid + ')"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots + '</svg></div>';
  }

  /** 环形图：items = [{label, value}] */
  function chartDonut(items, opts) {
    opts = opts || {};
    var data = (items || []).filter(function (d) { return d.value > 0; });
    if (!data.length) {
      return '<div class="empty"><div class="ico">' + icon('chart') + '</div><b>暂无占比数据</b><p>' +
        esc(opts.emptyHint || '有数据后自动生成') + '</p></div>';
    }
    var palette = ['#6366f1', '#ec4899', '#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6', '#14b8a6', '#ef4444'];
    var total = data.reduce(function (a, d) { return a + d.value; }, 0);
    var size = 168, r = 58, cw = 18, c = 2 * Math.PI * r;
    var offset = 0, rings = '';
    data.forEach(function (d, i) {
      var frac = d.value / total;
      var len = Math.max(frac * c - 2, 0.5);
      rings += '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" ' +
        'stroke="' + palette[i % palette.length] + '" stroke-width="' + cw + '" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + (c - len).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-offset).toFixed(2) + '" stroke-linecap="round" ' +
        'transform="rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')"><title>' + esc(d.label) + '：' + Core.fmtNum(d.value) + '</title></circle>';
      offset += frac * c;
    });
    var legend = data.map(function (d, i) {
      var pct = Math.round((d.value / total) * 100);
      return '<span><i style="background:' + palette[i % palette.length] + '"></i>' + esc(d.label) + ' ' + pct + '%</span>';
    }).join('');

    return '<div class="row" style="gap:18px;align-items:center;flex-wrap:wrap">' +
      '<div class="chart-wrap" style="flex:none;width:' + size + 'px">' +
      '<svg viewBox="0 0 ' + size + ' ' + size + '">' + rings +
      '<text x="' + size / 2 + '" y="' + (size / 2 - 2) + '" text-anchor="middle" font-size="19" font-weight="700" fill="var(--text)">' + Core.fmtNum(total) + '</text>' +
      '<text x="' + size / 2 + '" y="' + (size / 2 + 15) + '" text-anchor="middle" font-size="10.5" fill="var(--text-mute)">' + esc(opts.unit || '合计') + '</text>' +
      '</svg></div>' +
      '<div class="chart-legend" style="flex-direction:column;gap:6px;margin:0">' + legend + '</div></div>';
  }

  /** 横向条形图：items = [{label, value}] */
  function barsH(items, opts) {
    opts = opts || {};
    var data = (items || []).slice();
    if (!data.length) return '<div class="empty"><div class="ico">' + icon('chart') + '</div><b>暂无数据</b><p>' + esc(opts.emptyHint || '') + '</p></div>';
    var max = Math.max.apply(null, data.map(function (d) { return d.value; })) || 1;
    if (opts.stacked) {
      return '<div class="bars-h stacked">' + data.map(function (d) {
        var pct = Math.max(2, Math.round((d.value / max) * 100));
        return '<div class="bh-item"><div class="spread">' +
          '<span class="bh-label" title="' + esc(d.label) + '">' + esc(d.label) + '</span>' +
          '<span class="bh-val">' + (opts.format ? opts.format(d.value) : Core.fmtNum(d.value)) + '</span></div>' +
          '<span class="bh-track"><i class="bh-fill" style="width:' + pct + '%' + (d.color ? ';background:' + d.color : '') + '"></i></span></div>';
      }).join('') + '</div>';
    }
    return '<div class="bars-h">' + data.map(function (d) {
      var pct = Math.max(2, Math.round((d.value / max) * 100));
      return '<div class="bh-row"><span class="bh-label" title="' + esc(d.label) + '">' + esc(d.label) + '</span>' +
        '<span class="bh-track"><i class="bh-fill" style="width:' + pct + '%' + (d.color ? ';background:' + d.color : '') + '"></i></span>' +
        '<span class="bh-val">' + (opts.format ? opts.format(d.value) : Core.fmtNum(d.value)) + '</span></div>';
    }).join('') + '</div>';
  }

  /** 纵向柱状图：items = [{label, value}] */
  function barsV(items, opts) {
    opts = opts || {};
    var data = (items || []).slice();
    if (!data.length) return '<div class="empty"><div class="ico">' + icon('chart') + '</div><b>暂无数据</b><p>' + esc(opts.emptyHint || '') + '</p></div>';
    var max = Math.max.apply(null, data.map(function (d) { return d.value; })) || 1;
    return '<div class="bars-v">' + data.map(function (d) {
      var h = Math.max(3, Math.round((d.value / max) * 100));
      return '<div class="bv" title="' + esc(d.label + '：' + (opts.format ? opts.format(d.value) : d.value)) + '">' +
        '<div class="bv-track"><i class="bv-fill" style="height:' + h + '%' + (d.color ? ';background:' + d.color : '') + '"></i></div>' +
        '<span class="bv-label">' + esc(d.label) + '</span></div>';
    }).join('') + '</div>';
  }

  /** 进度环 */
  function ring(pct, opts) {
    opts = opts || {};
    var size = opts.size || 62, sw = opts.stroke || 7;
    var p = Math.max(0, Math.min(100, Core.num(pct)));
    var r = (size - sw) / 2, c = 2 * Math.PI * r;
    var color = opts.color || 'var(--brand)';
    return '<div class="ring-wrap" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="' + sw + '"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + sw + '" ' +
      'stroke-linecap="round" stroke-dasharray="' + ((p / 100) * c).toFixed(1) + ' ' + c.toFixed(1) + '" ' +
      'transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
      '</svg><div class="ring-text"><b>' + Math.round(p) + '<span style="display:inline;font-size:11px">%</span></b></div></div>';
  }

  /* ---------------- 月历 ---------------- */

  /**
   * calendar({year, month, weekStart, selected, cellHtml(date, meta), onclickAct})
   * cellHtml 返回格子内部 HTML（不含格子容器）
   */
  function calendar(cfg) {
    var year = cfg.year, month = cfg.month, ws = cfg.weekStart === 0 ? 0 : 1;
    var cells = Core.monthGrid(year, month, ws);
    var today = Core.ymd(new Date());
    var weekLabels = ws === 1 ? ['一', '二', '三', '四', '五', '六', '日'] : ['日', '一', '二', '三', '四', '五', '六'];

    var head = '<div class="cal-week">' + weekLabels.map(function (w) { return '<span>周' + w + '</span>'; }).join('') + '</div>';
    var grid = '<div class="cal-grid">' + cells.map(function (c) {
      var cls = 'cal-cell' + (c.inMonth ? '' : ' out') + (c.date === today ? ' today' : '') + (c.date === cfg.selected ? ' sel' : '');
      return '<button type="button" class="' + cls + '" data-act="pick-day" data-date="' + c.date + '">' +
        '<span class="d">' + c.day + '</span>' +
        (cfg.cellHtml ? cfg.cellHtml(c.date, c) : '') +
        '</button>';
    }).join('') + '</div>';

    return head + grid;
  }

  /* ---------------- 跨模块：加入今日计划 ---------------- */

  function addToPlan(item) {
    var Store = root.Store;
    if (!Store) return;
    var today = Core.ymd(new Date());
    var state = Store.get();
    var day = state.plans[today] || (state.plans[today] = { items: [], review: '' });
    if (item.refId) {
      var exists = day.items.some(function (it) {
        return it.source && it.source.refId === item.refId && !it.done;
      });
      if (exists) { toast('这条已经排进今日计划了', ''); return; }
    }
    Store.update(function (s) {
      var d = s.plans[today];
      d.items.push({
        id: Core.uid('plan'),
        title: item.title,
        module: item.module || 'other',
        time: item.time || '',
        priority: item.priority || 'mid',
        done: false,
        doneAt: '',
        note: item.note || '',
        source: item.refId ? { module: item.module || 'other', refId: item.refId } : null,
        createdAt: Core.nowISO()
      });
    }, 'add-to-plan');
    toast('已加入今日计划：' + item.title, 'ok');
  }

  /** 某条业务记录今天是否已排入今日计划 */
  function inPlanToday(refId) {
    if (!refId) return false;
    var st = root.Store ? root.Store.get() : null;
    if (!st) return false;
    var d = st.plans[Core.ymd(new Date())];
    if (!d) return false;
    return d.items.some(function (i) { return !i.done && i.source && i.source.refId === refId; });
  }

  /* ---------------- 常用片段 ---------------- */

  function moduleTag(key) {
    var m = MODULES[key] || MODULES.other;
    return '<span class="tag" style="background:color-mix(in srgb, ' + m.color + ' 13%, transparent);color:' + m.color + '">' + esc(m.name) + '</span>';
  }

  function priorityTag(p) {
    var m = PRIORITY[p] || PRIORITY.mid;
    return '<span class="tag ' + m.cls + '">' + m.name + '优先</span>';
  }

  function statCard(label, value, foot, iconName) {
    return '<div class="kpi"><div class="label">' + (iconName ? icon(iconName, 13) : '') + esc(label) + '</div>' +
      '<div class="value">' + value + '</div>' + (foot ? '<div class="foot">' + foot + '</div>' : '') + '</div>';
  }

  root.UI = {
    ICONS: ICONS, MODULES: MODULES, PRIORITY: PRIORITY,
    icon: icon, esc: esc, delegate: delegate, bind: bind, toast: toast,
    modal: buildModal, formModal: formModal, confirm: confirmDialog,
    emptyState: emptyState,
    chartLine: chartLine, chartDonut: chartDonut, barsH: barsH, barsV: barsV, ring: ring,
    calendar: calendar, addToPlan: addToPlan, inPlanToday: inPlanToday,
    moduleTag: moduleTag, priorityTag: priorityTag, statCard: statCard
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

    ];

  }

 * views/home.js — 首页总览

(function () {

  function render(el) {

    var games = Core.gamesStats(st.games.games, st.games.sessions, { today: today, weekStart: ws });

    var openItems = planDay.items.filter(function (i) { return !i.done; }).slice(0, 6);
    var doneCount = planDay.items.filter(function (i) { return i.done; }).length;
    var notes = st.notes.slice().sort(function (a, b) {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;

    }).slice(0, 8);

    el.innerHTML =
      '<div class="hero">' +

        '<div class="hero-stats">' +
          '<div><b>' + ps.rate + '%</b><span>今日完成</span></div>' +
          '<div><b>' + weekPosts + '</b><span>本周发布</span></div>' +
          '<div><b>' + fit.streak + '</b><span>连续训练(天)</span></div>' +
        '</div>' +
      '</div>' +

      '<div class="grid g-home mt-16">' +
        '<div class="stack">' +
          '<div class="card">' +
            '<div class="card-head">' +
              '<div class="card-title">' + UI.icon('checkSquare') + ' 今日计划' +
                '<span class="tag brand">' + ps.done + '/' + ps.total + '</span></div>' +
              '<div class="row"><button class="btn btn-sm btn-ghost" data-act="go" data-key="plan">查看全部' + UI.icon('chevronRight', 13) + '</button></div>' +

    /* ---- 事件 ---- */

    UI.bind(el, 'click', function (e) {

      if (act === 'go') { window.App.go(btn.dataset.key); return; }

          var d = s.plans[today] || (s.plans[today] = { items: [], review: '' });

        var input = el.querySelector('#homeQuick');
        var title = (input.value || '').trim();
        if (!title) { input.focus(); return; }
        Store.update(function (s) {
          var d = s.plans[today] || (s.plans[today] = { items: [], review: '' });
          d.items.push({
            id: Core.uid('plan'), title: title, module: 'plan', time: '', priority: 'mid',

          });
        }, 'home-quick-add');
        render(el);
        UI.toast('已加入今日计划', 'ok', 1400);
      } else if (act === 'note-add') {
        var ni = el.querySelector('#noteInput');
        var text = (ni.value || '').trim();
        if (!text) { ni.focus(); return; }
        Store.update(function (s) {
          s.notes.push({ id: Core.uid('note'), text: text, pinned: false, createdAt: Core.nowISO() });
        }, 'note-add');
        render(el);
      } else if (act === 'note-del') {
        Store.update(function (s) { s.notes = s.notes.filter(function (n) { return n.id !== id; }); }, 'note-del');
        render(el);
      } else if (act === 'note-pin') {
        Store.update(function (s) {
          var n = Core.byId(s.notes, id);
          if (n) n.pinned = !n.pinned;
        }, 'note-pin');
        render(el);
      }
    });

    var q = el.querySelector('#homeQuick');
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.querySelector('[data-act="quick-add"]').click(); }
    });
    var ni = el.querySelector('#noteInput');
    ni.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.querySelector('[data-act="note-add"]').click(); }
    });
  }

  window.Views.home = {
    title: '首页总览',
    sub: function () {
      var st = Store.get();
      var open = (st.plans[Core.ymd(new Date())] || { items: [] }).items.filter(function (i) { return !i.done; }).length;
      return '今天还有 ' + open + ' 件未完成 · 数据保存在本机，随时可导出备份';
    },
    render: render
  };
})();

<script>
/*!
 * views/plan.js — 今日计划
 */
window.Views = window.Views || {};
(function () {
  'use strict';
  var Core = window.Core, Store = window.Store, UI = window.UI;

  var selected = Core.ymd(new Date());
  var reviewTimer = null;

  var PRIO_OPTS = [{ v: 'high', t: '高' }, { v: 'mid', t: '中' }, { v: 'low', t: '低' }];

  function moduleOpts() {
    return Object.keys(UI.MODULES).map(function (k) { return { v: k, t: UI.MODULES[k].name }; });
  }

  function day(date) {
    var d = Store.get().plans[date];
    return d || { items: [], review: '' };
  }

  function ensureDay(state, date) {
    if (!state.plans[date]) state.plans[date] = { items: [], review: '' };
    return state.plans[date];
  }

  function sorted(items) {
    var rank = { high: 0, mid: 1, low: 2 };
    return items.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.time && b.time && a.time !== b.time) return a.time < b.time ? -1 : 1;
      if (a.time && !b.time) return -1;
      if (!a.time && b.time) return 1;
      var d = (rank[a.priority] || 1) - (rank[b.priority] || 1);
      if (d) return d;
      return a.createdAt < b.createdAt ? -1 : 1;
    });
  }

  function itemHTML(it) {
    return '<div class="plan-item' + (it.done ? ' done' : '') + '" data-id="' + it.id + '">' +
      '<button class="check' + (it.done ? ' on' : '') + '" data-act="toggle" data-id="' + it.id + '" aria-label="完成">' + UI.icon('check', 12) + '</button>' +
      '<div class="grow">' +
        '<div class="plan-title">' + UI.esc(it.title) + '</div>' +
        '<div class="plan-meta">' +
          (it.priority !== 'low' ? '<span class="prio ' + it.priority + '" title="' + (it.priority === 'high' ? '高优先' : '中优先') + '"></span>' : '') +
          (it.time ? '<span class="tag">' + UI.icon('clock', 11) + ' ' + UI.esc(it.time) + '</span>' : '') +
          UI.moduleTag(it.module) +
          (it.source ? '<span class="tag info">来自模块</span>' : '') +
          (it.note ? '<span class="tag">' + UI.esc(it.note.slice(0, 16)) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="row" style="gap:0">' +
        '<button class="icon-btn" data-act="edit" data-id="' + it.id + '" title="编辑">' + UI.icon('edit') + '</button>' +
        '<button class="icon-btn danger" data-act="del" data-id="' + it.id + '" title="删除">' + UI.icon('trash') + '</button>' +
      '</div>' +
    '</div>';
  }

  function itemForm(values, after) {
    UI.formModal({
      title: values && values.id ? '编辑事项' : '新增今日事项',
      desc: '日期：' + Core.fmtDateCN(selected),
      fields: [
        { key: 'title', label: '要做什么', type: 'text', required: true, span: 2, placeholder: '例如：把首页的进度环调好' },
        { key: 'module', label: '所属方向', type: 'select', options: moduleOpts() },
        { key: 'priority', label: '优先级', type: 'select', options: PRIO_OPTS },
        { key: 'time', label: '时间点（可选）', type: 'time', hint: '例如 09:30，会排在列表前面' },
        { key: 'note', label: '备注（可选）', type: 'text' }
      ],
      values: values || { module: 'plan', priority: 'mid', time: '', note: '' },
      onSubmit: function (v) { after(v); }
    });
  }

  function render(el) {
    var state = Store.get();
    var d = day(selected);
    var stats = Core.planStats(d);
    var items = sorted(d.items);
    var open = items.filter(function (i) { return !i.done; });
    var done = items.filter(function (i) { return i.done; });
    var isToday = selected === Core.ymd(new Date());
    var ws = state.settings.weekStart;
    var week = Core.weekDates(selected, ws);

    var strip = week.map(function (date) {
      var dd = day(date);
      var hasOpen = dd.items.some(function (i) { return !i.done; });
      var w = ['日', '一', '二', '三', '四', '五', '六'][Core.toDate(date).getDay()];
      return '<button class="day' + (date === selected ? ' active' : '') + (hasOpen ? ' has' : '') + '" data-act="pick" data-date="' + date + '">' +
        '<span>' + w + '</span><b>' + Number(date.slice(8, 10)) + '</b><i class="pip"></i></button>';
    }).join('');

    el.innerHTML =
      '<div class="card">' +
        '<div class="spread" style="margin-bottom:12px;flex-wrap:wrap;gap:10px">' +
          '<div class="row">' +
            '<button class="icon-btn" data-act="prev" title="前一天">' + UI.icon('chevronLeft', 17) + '</button>' +
            '<div style="min-width:0">' +
              '<div class="cal-title">' + Core.fmtDateCN(selected) + (isToday ? ' <span class="tag brand">今天</span>' : '') + '</div>' +
              '<div class="small muted">' + (stats.total ? '共 ' + stats.total + ' 项 · 已完成 ' + stats.done + ' 项' : '这一天还没有安排') + '</div>' +
            '</div>' +
            '<button class="icon-btn" data-act="next" title="后一天">' + UI.icon('chevronRight', 17) + '</button>' +
          '</div>' +
          '<div class="row">' +
            '<input type="date" class="input" id="datePick" value="' + selected + '" style="width:150px">' +
            '<button class="btn btn-sm" data-act="today">回到今天</button>' +
            '<button class="btn btn-primary btn-sm" data-act="add">' + UI.icon('plus', 14) + ' 新增事项</button>' +
          '</div>' +
        '</div>' +
        '<div class="day-strip">' + strip + '</div>' +
      '</div>' +

      '<div class="grid g-home mt-16">' +
        '<div class="stack">' +
          '<div class="card">' +
            '<div class="card-head">' +
              '<div class="card-title">' + UI.icon('checkSquare') + ' 待办清单</div>' +
              '<div class="small muted">' + stats.rate + '% 完成</div>' +
            '</div>' +
            '<div class="progress ' + (stats.rate === 100 ? 'ok' : '') + '" style="margin-bottom:12px"><i style="width:' + stats.rate + '%"></i></div>' +
            '<div class="quick-add" style="margin-bottom:10px">' +
              '<input class="input" id="quickTitle" placeholder="快速添加一件事，回车确认…">' +
              '<button class="btn btn-soft" data-act="quick-add">' + UI.icon('plus', 14) + ' 添加</button>' +
            '</div>' +
            (items.length ? (
              '<div>' + open.map(itemHTML).join('') +
              (done.length ? '<div class="divider"></div><div class="small muted" style="padding:0 8px 4px">已完成 ' + done.length + ' 项</div>' + done.map(itemHTML).join('') : '') +
              '</div>'
            ) : UI.emptyState('checkSquare', '这一天还没有安排', '在上面输入框写点什么，或从自媒体/开发/咨询/健身模块把事项加进来', '')) +
            (done.length ? '<div class="mt-12" style="text-align:right"><button class="btn btn-sm btn-ghost" data-act="clear-done">清理已完成（' + done.length + '）</button></div>' : '') +
          '</div>' +
        '</div>' +

        '<div class="stack">' +
          '<div class="card">' +
            '<div class="card-head"><div class="card-title">' + UI.icon('target') + ' 完成情况</div></div>' +
            '<div class="row" style="gap:16px">' +
              UI.ring(stats.rate, { size: 74, stroke: 8 }) +
              '<div class="grow">' +
                '<div class="spread small"><span class="dim">未完成</span><b class="mono">' + stats.open + ' 项</b></div>' +
                '<div class="spread small mt-8"><span class="dim">高优先未完成</span><b class="mono" style="color:var(--danger)">' + stats.highOpen + ' 项</b></div>' +
                '<div class="spread small mt-8"><span class="dim">来自其他模块</span><b class="mono">' + d.items.filter(function (i) { return i.source; }).length + ' 项</b></div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="card-head"><div class="card-title">' + UI.icon('note') + ' 当日复盘</div><span class="small muted">自动保存</span></div>' +
            '<textarea class="textarea" id="review" placeholder="今天推进了什么？卡在哪里？明天第一件事做什么？" style="min-height:120px">' + UI.esc(d.review) + '</textarea>' +
          '</div>' +
          '<div class="hint-box">' + UI.icon('info') +
            '<div>各模块里的「加入今日计划」会把事项带到这里；勾选完成不会自动改模块状态，避免误操作。</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    /* ---- 事件 ---- */

    el.querySelectorAll('[data-act="pick"]').forEach(function (b) {
      b.addEventListener('click', function () { selected = b.dataset.date; render(el); });
    });
    el.querySelector('[data-act="prev"]').addEventListener('click', function () {
      selected = Core.addDays(selected, -1); render(el);
    });
    el.querySelector('[data-act="next"]').addEventListener('click', function () {
      selected = Core.addDays(selected, 1); render(el);
    });
    el.querySelector('[data-act="today"]').addEventListener('click', function () {
      selected = Core.ymd(new Date()); render(el);
    });
    var dp = el.querySelector('#datePick');
    dp.addEventListener('change', function () {
      if (/^\d{4}-\d{2}-\d{2}$/.test(dp.value)) { selected = dp.value; render(el); }
    });

    function addQuick() {
      var input = el.querySelector('#quickTitle');
      var title = (input.value || '').trim();
      if (!title) { input.focus(); return; }
      Store.update(function (s) {
        var d2 = ensureDay(s, selected);
        d2.items.push({
          id: Core.uid('plan'), title: title, module: 'plan', time: '', priority: 'mid',
          done: false, doneAt: '', note: '', source: null, createdAt: Core.nowISO()
        });
      }, 'plan-add');
      render(el);
    }

    el.querySelector('[data-act="quick-add"]').addEventListener('click', addQuick);
    el.querySelector('#quickTitle').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); addQuick(); }
    });

    el.querySelector('[data-act="add"]').addEventListener('click', function () {
      itemForm(null, function (v) {
        Store.update(function (s) {
          var d2 = ensureDay(s, selected);
          d2.items.push({
            id: Core.uid('plan'), title: v.title, module: v.module, time: v.time, priority: v.priority,
            done: false, doneAt: '', note: v.note, source: null, createdAt: Core.nowISO()
          });
        }, 'plan-add');
        render(el);
      });
    });

    UI.bind(el, 'click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.dataset.act, id = btn.dataset.id;
      if (act === 'toggle') {
        Store.update(function (s) {
          var d2 = ensureDay(s, selected);
          var it = Core.byId(d2.items, id);
          if (it) { it.done = !it.done; it.doneAt = it.done ? Core.nowISO() : ''; }
        }, 'plan-toggle');
        render(el);
      } else if (act === 'del') {
        Store.update(function (s) {
          var d2 = ensureDay(s, selected);
          d2.items = d2.items.filter(function (i) { return i.id !== id; });
        }, 'plan-del');
        render(el);
      } else if (act === 'edit') {
        var it = Core.byId(day(selected).items, id);
        if (!it) return;
        itemForm(it, function (v) {
          Store.update(function (s) {
            var d2 = ensureDay(s, selected);
            var target = Core.byId(d2.items, id);
            if (target) {
              target.title = v.title; target.module = v.module; target.time = v.time;
              target.priority = v.priority; target.note = v.note;
            }
          }, 'plan-edit');
          render(el);
        });
      } else if (act === 'clear-done') {
        UI.confirm({
          title: '清理已完成事项',
          message: '这一天已完成的 ' + done.length + ' 项会被删除，未完成的不受影响。',
          confirmText: '清理',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          Store.update(function (s) {
            var d2 = ensureDay(s, selected);
            d2.items = d2.items.filter(function (i) { return !i.done; });
          }, 'plan-clear');
          render(el);
        });
      }
    });

    var review = el.querySelector('#review');
    review.addEventListener('input', function () {
      clearTimeout(reviewTimer);
      reviewTimer = setTimeout(function () {
        Store.update(function (s) {
          var d2 = ensureDay(s, selected);
          d2.review = review.value;
        }, 'plan-review');
      }, 350);
    });
  }

  window.Views.plan = {
    title: '今日计划',
    sub: function () { return '以日期为中心，一天一页 · 各模块的事项都可以排进来'; },
    render: render
  };
})();
